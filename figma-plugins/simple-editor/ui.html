<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Просто редактор</title>
    <style>
      @font-face {
        font-family: "Lab Grotesque";
        font-style: normal;
        font-weight: 400;
        font-display: optional;
        src:
          url(https://s.kontur.ru/common-v2/fonts/LabGrotesque/LabGrotesque-Regular.woff2)
            format("woff2"),
          url(https://s.kontur.ru/common-v2/fonts/LabGrotesque/LabGrotesque-Regular.woff)
            format("woff");
      }

      @font-face {
        font-family: "Lab Grotesque";
        font-style: normal;
        font-weight: 500;
        font-display: optional;
        src:
          url(https://s.kontur.ru/common-v2/fonts/LabGrotesque/LabGrotesque-Medium.woff2)
            format("woff2"),
          url(https://s.kontur.ru/common-v2/fonts/LabGrotesque/LabGrotesque-Medium.woff)
            format("woff");
      }

      @font-face {
        font-family: "Lab Grotesque";
        font-style: normal;
        font-weight: 700;
        font-display: optional;
        src:
          url(https://s.kontur.ru/common-v2/fonts/LabGrotesque/LabGrotesque-Bold.woff2)
            format("woff2"),
          url(https://s.kontur.ru/common-v2/fonts/LabGrotesque/LabGrotesque-Bold.woff)
            format("woff");
      }

      :root {
        --brand-blue: #2291ff;
        --brand-navy: #366af3;
        --brand-green: #25ad50;
        --brand-orange: #fc7630;
        --brand-red: #fe4c4c;
        --brand-purple: #844bec;
        --header: #292929;
        --text: rgba(0, 0, 0, 0.88);
        --muted: rgba(0, 0, 0, 0.56);
        --caption: rgba(0, 0, 0, 0.4);
        --card: #f2f2f2;
        --border: rgba(0, 0, 0, 0.12);
        --border-soft: rgba(0, 0, 0, 0.08);
        --bg: #ffffff;
        --font-family:
          "Lab Grotesque", "Lab Grotesque K", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --dur-fast: 120ms;
        --dur-base: 180ms;
        --loader-scan-duration: 2s;
        --fragment-highlight-dur: 220ms;
        --score-red-bg: #ffedef;
        --score-red-border: #d6191a;
        --score-red-tag: #c50220;
        --score-yellow-bg: #fff1ca;
        --score-yellow-border: #fdaa00;
        --score-yellow-tag: #d26e00;
        --score-green-bg: #defbe2;
        --score-green-border: #008d3a;
        --score-green-tag: #007f34;
        --surface: #ffffff;
        --text-solid: #000000;
        --icon-default: #222222;
        --card-hover: #e8e8e8;
        --card-active: #dcdcdc;
        --row-hover: #f8f8f8;
        --row-active: #ebebeb;
        --field-disabled-bg: #f0f0f0;
        --surface-hover: #fafafa;
        --surface-active: #f3f3f3;
        --blue-tint: #e2f5ff;
        --blue-tint-hover: #d4eeff;
        --dark-btn: #3d3d3d;
        --dark-btn-hover: #555555;
        --dark-btn-active: #2f2f2f;
        --dark-btn-text: rgba(255, 255, 255, 0.96);
        --track-off: #dddddd;
        --track-off-hover: #cfcfcf;
        --scan-trail-from: rgba(34, 145, 255, 0);
        --scan-trail-to: rgba(34, 145, 255, 0.3);
        --overlay-04: rgba(0, 0, 0, 0.04);
        --overlay-05: rgba(0, 0, 0, 0.05);
        --overlay-06: rgba(0, 0, 0, 0.06);
        --overlay-07: rgba(0, 0, 0, 0.07);
        --overlay-10: rgba(0, 0, 0, 0.1);
        --overlay-16: rgba(0, 0, 0, 0.16);
        --overlay-20: rgba(0, 0, 0, 0.2);
        --overlay-22: rgba(0, 0, 0, 0.22);
        --overlay-24: rgba(0, 0, 0, 0.24);
        --overlay-28: rgba(0, 0, 0, 0.28);
        --overlay-32: rgba(0, 0, 0, 0.32);
        --hover-bg: rgba(0, 0, 0, 0.08);
        --active-bg: rgba(0, 0, 0, 0.12);
        --backdrop: rgba(255, 255, 255, 0.8);
      }

      @media (prefers-reduced-motion: reduce) {
        :root {
          --dur-fast: 0ms;
          --dur-base: 0ms;
          --fragment-highlight-dur: 0ms;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-family);
        font-size: 14px;
        line-height: 20px;
      }

      button,
      input,
      select,
      textarea {
        font-family: inherit;
      }

      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background: var(--bg);
      }

      button,
      .icon-btn,
      .action-card,
      .menu-item,
      .action-btn,
      .variant-card,
      .more-btn,
      .btn-save,
      .accordion-header,
      .select-input,
      .key-input,
      .toast-close {
        transition:
          background var(--dur-fast) var(--ease),
          border-color var(--dur-fast) var(--ease),
          color var(--dur-fast) var(--ease),
          opacity var(--dur-fast) var(--ease),
          transform var(--dur-fast) var(--ease);
      }

      button:focus-visible,
      .icon-btn:focus-visible,
      .action-card:focus-visible,
      .menu-item:focus-visible,
      .action-btn:focus-visible,
      .variant-card:focus-visible,
      .more-btn:focus-visible,
      .btn-save:focus-visible,
      .accordion-header:focus-visible,
      .select-input:focus-visible,
      .key-input:focus-visible {
        outline: 2px solid var(--brand-blue);
        outline-offset: 2px;
      }

      .icon-btn {
        background: none;
        border: none;
        padding: 4px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: inherit;
        border-radius: 6px;
      }

      .icon-btn:hover {
        background: var(--hover-bg);
      }

      .icon-btn:active {
        transform: scale(0.94);
      }

      .icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .help-icon svg {
        opacity: 0.56;
        transition: opacity var(--dur-fast) var(--ease);
      }

      .help-icon:hover svg {
        opacity: 1;
      }

      .nav-row {
        display: flex;
        align-items: center;
        padding: 32px 16px 0;
        flex-shrink: 0;
      }

      .nav-row.nav-deep {
        padding: 32px 16px 0;
      }

      .nav-row .icon-btn {
        width: 24px;
        height: 24px;
        padding: 0;
        border-radius: 4px;
      }

      .screen {
        flex: 1;
        padding: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .screen.padded {
        padding: 32px 16px 24px;
        overflow-y: auto;
      }

      .screen.padded-flush {
        padding: 32px 16px 0;
        overflow-y: auto;
      }

      .screen.padded-flush.no-bottom-bar {
        padding-bottom: 24px;
      }

      .screen.settings {
        gap: 24px;
      }

      .screen.rules {
        gap: 4px;
      }

      .screen.info {
        gap: 16px;
      }

      .intro-title {
        display: flex;
        align-items: baseline;
        padding: 16px 16px 0;
        margin: 0;
        font-size: 16.8px;
        font-weight: 400;
        line-height: 22px;
      }

      .intro-title .logo {
        color: var(--text);
      }

      .intro-title .redaktor {
        color: var(--brand-blue);
      }

      .prompt-text {
        padding: 44px 16px 0;
        margin: 0;
        font-size: 14px;
        line-height: 1.43;
        color: var(--text-solid);
      }

      .prompt-text .accent {
        color: var(--brand-blue);
      }

      .intro-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 32px;
      }

      .intro-empty-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto;
      }

      .intro-empty-icon svg {
        display: block;
        width: 64px;
        height: 64px;
      }

      .intro-empty-msg {
        margin-top: 20px;
        max-width: 293px;
        font-size: 28px;
        font-weight: 700;
        line-height: 36px;
        color: var(--text);
      }

      .intro-empty-slot {
        margin-top: 16px;
        min-height: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .intro-empty-action {
        margin-top: 0;
        padding: 0;
        border: none;
        background: none;
        font-size: 14px;
        line-height: 20px;
        color: var(--brand-blue);
        cursor: pointer;
        text-decoration: underline;
        transition: color var(--dur-fast) var(--ease);
      }

      .intro-empty-action:hover {
        color: var(--brand-navy);
      }

      .action-cards {
        padding: 24px 16px 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .action-card {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        background: var(--card);
        border: none;
        border-radius: 16px;
        padding: 8px 16px 8px 8px;
        text-align: left;
        cursor: pointer;
        transition: background var(--dur-fast) var(--ease);
      }

      .action-card:hover:not(:disabled) {
        background: var(--card-hover);
      }

      .action-card:active:not(:disabled) {
        transform: scale(0.99);
        background: var(--card-active);
      }

      .action-card:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .action-card-icon {
        width: 40px;
        height: 40px;
        background: var(--surface);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .action-card-icon svg {
        width: 24px;
        height: 24px;
      }

      .action-card-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .action-card-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
      }

      .action-card-desc {
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
      }

      .menu-items {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 32px;
        padding: 0 16px;
      }

      .menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 40px;
        padding: 0;
        border: none;
        background: transparent;
        border-radius: 8px;
        cursor: pointer;
        color: inherit;
      }

      .menu-item:hover {
        background: var(--row-hover);
      }

      .menu-item:active {
        background: var(--row-active);
        transform: scale(0.99);
      }

      .menu-item-left {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 8px;
      }

      .menu-item-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        margin-right: 8px;
        flex-shrink: 0;
      }

      .menu-item-icon {
        width: 24px;
        height: 24px;
        background: var(--card);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .menu-item-label {
        font-size: 15px;
        line-height: 22px;
      }

      .section {
        display: flex;
        flex-direction: column;
      }

      .section-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
      }

      .section-caption {
        font-size: 12px;
        line-height: 16px;
        color: var(--caption);
        margin-top: 2px;
      }

      .label-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 8px;
      }

      .help-icon {
        width: 16px;
        height: 16px;
        padding: 0;
        cursor: pointer;
        flex-shrink: 0;
      }

      .help-icon-static {
        cursor: default;
      }

      .api-row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .api-row .select-input {
        flex: 1;
      }

      .select-input,
      .text-input,
      .key-input {
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 8px;
        font-size: 14px;
        color: var(--text);
        background: var(--surface);
      }

      .select-input:not(:disabled):hover,
      .key-input:not(:disabled):hover {
        border-color: var(--overlay-28);
      }

      .select-input {
        appearance: none;
        cursor: pointer;
        background-image: url("data:image/svg+xml,%3Csvg width='10' height='5' viewBox='0 0 10 5' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 0.5L5 4.5L9 0.5' stroke='%23222' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 8px center;
        padding-right: 24px;
      }

      .select-input:not(:disabled):hover {
        background-color: var(--hover-bg);
      }

      .select-input:not(:disabled):active {
        background-color: var(--active-bg);
      }

      .text-input:disabled,
      .select-input:disabled,
      .key-input:disabled,
      .kb-field {
        color: var(--overlay-32);
        background: var(--field-disabled-bg);
        border-color: var(--border-soft);
        border-radius: 8px;
        cursor: not-allowed;
      }

      .key-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .field > .key-row {
        margin-top: 0;
      }

      .key-row + .select-input,
      .api-row + .select-input,
      .section > .select-input,
      .api-row + .section-caption {
        margin-top: 8px;
      }

      .key-row .key-input {
        flex: 1;
        border-radius: 8px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 8px;
      }

      .field-label {
        font-size: 12px;
        color: var(--caption);
      }

      .field .text-input,
      .field .select-input,
      .field .key-input {
        width: 100%;
      }

      .btn-save {
        height: 32px;
        padding: 0 12px;
        background: var(--dark-btn);
        color: var(--dark-btn-text);
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
      }

      .btn-save:hover:not(:disabled) {
        background: var(--dark-btn-hover);
      }

      .btn-save:active:not(:disabled) {
        transform: scale(0.97);
        background: var(--dark-btn-active);
      }

      .btn-check {
        height: 32px;
        padding: 0 12px;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
      }

      .btn-check:hover:not(:disabled) {
        background: var(--hover-bg);
        border-color: var(--overlay-24);
      }

      .btn-check:active:not(:disabled) {
        transform: scale(0.97);
        background: var(--active-bg);
      }

      .btn-save:disabled,
      .btn-check:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .toggles {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 8px;
      }

      .toggle-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .toggle-text {
        font-size: 14px;
        line-height: 20px;
        padding-top: 6px;
      }

      .toggle-caption {
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
        margin-top: 2px;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 32px;
        height: 20px;
        flex-shrink: 0;
        margin-top: 6px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .switch-slider {
        position: absolute;
        inset: 0;
        cursor: pointer;
        background: var(--track-off);
        border-radius: 16px;
        transition: background var(--dur-base) var(--ease);
      }

      .switch-slider::before {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        left: 3px;
        top: 3px;
        border-radius: 50%;
        background: var(--surface);
        box-shadow: 0 1px 2px var(--overlay-20);
        transition: transform var(--dur-base) var(--ease);
      }

      .switch input:checked + .switch-slider {
        background: var(--dark-btn);
      }

      .switch input:checked + .switch-slider::before {
        transform: translateX(12px);
      }

      .switch:hover .switch-slider {
        background: var(--track-off-hover);
      }

      .switch:hover input:checked + .switch-slider {
        background: var(--dark-btn-active);
      }

      .number-input {
        width: 53px;
        height: 32px;
        border-radius: 8px;
        flex-shrink: 0;
      }

      .kb-table {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
      }

      .kb-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .kb-name {
        width: 160px;
        flex-shrink: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .kb-url {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .accordion {
        background: var(--card);
        border-radius: 12px;
        overflow: hidden;
      }

      .accordion + .accordion {
        margin-top: 4px;
      }

      .accordion-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 8px;
        border: none;
        background: transparent;
        cursor: pointer;
        text-align: left;
        color: inherit;
      }

      .accordion-header:hover {
        background: var(--hover-bg);
      }

      .accordion-header:active {
        background: var(--overlay-07);
      }

      .accordion-header-left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .accordion-icon {
        width: 24px;
        height: 24px;
        background: var(--surface);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .accordion-title {
        font-size: 15px;
        line-height: 22px;
      }

      .accordion-arrow {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        transition: transform 0.2s var(--ease);
      }

      .accordion.open .accordion-arrow {
        transform: rotate(180deg);
      }

      .accordion-body {
        padding: 8px;
      }

      .rules-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .rule {
        font-size: 13px;
        line-height: 16px;
        padding-left: 20px;
        text-indent: -20px;
      }

      .rule-num {
        color: var(--muted);
        margin-right: 4px;
      }

      .rule code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        background: var(--overlay-05);
        border-radius: 4px;
        padding: 0 4px;
      }

      .score-header {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 16px;
      }

      .score-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 22px;
        color: var(--text);
      }

      .result-card {
        border-radius: 16px;
        padding: 8px 12px;
      }

      .result-card.tone-bad {
        background: var(--score-red-bg);
        border: 1px solid var(--score-red-border);
      }

      .result-card.tone-warn {
        background: var(--score-yellow-bg);
        border: 1px solid var(--score-yellow-border);
      }

      .result-card.tone-ok {
        background: var(--score-green-bg);
        border: 1px solid var(--score-green-border);
      }

      .result-card.tone-perfect {
        background: var(--surface);
        border: 1px solid var(--border);
      }

      .result-text {
        font-size: 14px;
        line-height: 20px;
      }

      .result-tags {
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      ul.result-tags {
        margin-bottom: 0;
        padding-left: 18px;
        list-style: disc;
      }

      .result-tag {
        font-size: 12px;
        line-height: 16px;
        background: none;
        border: none;
        padding: 0;
        text-align: left;
        cursor: default;
      }

      .result-tag[data-fragment-idx] {
        padding: 1px 4px;
        margin: -1px -4px;
        border-radius: 4px;
        transition: background var(--dur-fast) var(--ease);
      }

      .result-tag[data-fragment-idx]:hover {
        background: var(--hover-bg);
      }

      .tone-bad .result-tag {
        color: var(--score-red-tag);
      }

      .tone-warn .result-tag {
        color: var(--score-yellow-tag);
      }

      .tone-ok .result-tag {
        color: var(--score-green-tag);
      }

      .tone-perfect .result-tag {
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

      const BUNDLED_SOURCE_TEXTS = {
        "https://guides.kontur.ru/principles/text/styleguide/":
          "# Основные правила текста в интерфейсе\n\n1. **Пишите для задачи пользователя**\n   - Пользователь пришёл решить задачу, поэтому текст не должен мешать этому.\n   - У текста должна быть функция: объяснить, предупредить, помочь принять решение или выполнить действие.\n   - Не стремитесь просто сократить текст — важнее баланс **простоты, краткости и полезности**.\n\n2. **Пишите просто**\n   - Упрощайте синтаксис: следите за составом и порядком слов.\n   - Используйте понятные слова и конструкции.\n   - Сложность текста должна быть оправдана задачей, а не стремлением написать как можно короче.\n\n3. **В заголовке сразу говорите главное**\n   - Рассчитывайте на то, что пользователь может прочитать только заголовок.\n   - Формулируйте в нём главное: **что произошло, что нужно понять или что нужно сделать**.\n   - Не начинайте заголовок с приветствий и общих фраз.\n\n4. **Делайте заголовки различимыми**\n   - Похожие сообщения не должны называться одинаково.\n   - Первые слова заголовка должны помогать быстро понять, о какой ситуации идёт речь.\n   - Это облегчает и работу пользователя, и работу поддержки.\n\n5. **В основном тексте давайте только нужные подробности**\n   В зависимости от ситуации рассказывайте:\n   - что произошло;\n   - что теперь делать;\n   - что делать или не делать в будущем, чтобы избежать проблемы.\n\n   Все три пункта не обязательны. Если причина ошибки зависит от действий пользователя, важно объяснить, как её избежать.\n\n6. **Текст кнопки должен продолжать сообщение**\n   - Формулировка кнопки должна соответствовать действию, которое предлагается в тексте.\n   - Если конкретного действия нет, подумайте, какие сценарии нужны пользователю, и дайте ему соответствующие выходы.\n\n7. **Не перегружайте пользователя действиями**\n   - Если кнопок слишком много, часть действий можно вынести в текст сообщения.\n   - Оставляйте в интерфейсе только действительно нужные действия.\n\n8. **В подтверждении действия показывайте конкретные последствия**\n   - Не ограничивайтесь вопросом вроде «Вы уверены?».\n   - Показывайте, **что именно произойдёт** и с какими данными.\n   - Особенно полезно давать конкретику из мира пользователя.\n\n9. **Не используйте подтверждения для частых действий**\n   - Если пользователь часто выполняет действие или делает его несколько раз подряд, подтверждение будет только прерывать работу.\n   - Лучше дать возможность отменить действие или восстановить данные.\n\n10. **В тостах и хинтах пишите как в подписях**\n    - Это вспомогательный текст.\n    - Точка **не ставится в конце**, если это одно предложение/подпись.\n    - Если внутри несколько предложений, точки ставятся между ними.\n\n11. **В тултипе различайте подпись и полноценный текст**\n    - Если это короткая подпись — точка в конце не нужна.\n    - Если это инструкция или полноценный текст из нескольких абзацев — используйте обычные правила пунктуации.\n\n12. **Подсказка в поле должна дополнять подпись**\n    Подсказка может объяснить:\n    - какие данные можно ввести;\n    - по каким реквизитам работает поиск;\n    - в каком формате вводить данные;\n    - где найти нужную информацию.\n\n    Не дублируйте в подсказке то, что уже сказано в подписи к полю.\n\n13. **Не пишите в плейсхолдере «Введите», «Укажите», «Заполните»**\n    Действие и так понятно из контекста поля.\n\n14. **Не прячьте полноценную инструкцию в подсказке поля**\n    Если инструкция содержит много условий, пользователь не сможет удержать их в памяти во время ввода.\n    Вынесите её в отдельный текстовый блок или спрячьте за ссылку.\n\n15. **Выбирайте правильного «говорящего»**\n    В интерфейсе есть две основные модальности:\n    - **робот** — сообщает о событиях;\n    - **Контур** — объясняет, рассказывает о возможностях и предупреждает об изменениях.\n\n16. **Результат действия сообщайте коротко и без персонификации**\n    Если текст сообщает результат недавнего действия пользователя, говорит «робот»: коротко и по делу.\n\n17. **События в сервисе тоже описывайте от лица робота**\n    В письмах и СМС о событиях:\n    - не используйте персонификацию;\n    - не используйте формы вежливости;\n    - допустим страдательный залог;\n    - пишите коротко и по делу.\n\n18. **Объяснения и инструкции пишите от лица Контура**\n    Когда нужно объяснить пользователю, **что и почему произошло или как работает процесс**, говорит Контур.\n    Используйте действующее лицо: «мы сделали», «Контур отправит», «налоговая запросила». Это делает смысл однозначным.\n\n19. **Явно называйте действующих лиц**\n    Особенно когда в ситуации участвуют несколько сторон: пользователь, Контур, госорган, партнёр и т. д.\n    Это помогает избежать двусмысленности.\n\n20. **«Вы» — со строчной**\n    Местоимение «вы» пишется со строчной буквы, если не стоит первым словом предложения. Уважение передаётся смыслом и тональностью текста.\n\n21. **Склоняйте «Контур» и названия продуктов**\n    Название «Контур» и названия продуктов склоняются. Исключение — «СКБ Контур» из-за аббревиатуры.\n",
        "https://guides.kontur.ru/principles/text/typography/":
          '# Экранная типографика — правила Контур.Гайды\n\nПравила экранной типографики для сервисов Контура. Если ответа нет ни в редполитике Контура, ни в гайде «Текст в интерфейсе», ни здесь, ни в редполитике продукта — обращайтесь к справочнику Мильчина и Чельцовой (правила набора) и справочнику Лопатина (орфография и пунктуация).\n\nКлассические типографские нормы родом из печатных изданий подходят для экрана не всегда — традиции стоит уважать, но переносить на экран с умом.\n\n## Неразрывный пробел\n\n- Неразрывный пробел используется везде, где данные не должны разрываться переносом строки: предлоги и союзы не отрываются от слова, число не разваливается на группы разрядов, инициалы не отрываются от фамилии.\n- В шрифте Lab Grotesque классический «тонкий» неразрывный пробел почти невидим — поэтому используется обычный неразрывный пробел.\n- Хоткей: `⌥ + space` (MacOS или раскладка Бирмана).\n\n## Буквы и знаки\n\n- Используйте настоящие типографские знаки, а не их имитацию (например, не дублируйте дефис вместо тире). Если не знаете, как набрать знак — ищите в таблице Юникода.\n- **Единицы измерения** (в т.ч. знаки валют и процента) отделяются от числа неразрывным пробелом.\n- **Буква Ё**: каждый продукт сам решает, использовать её или нет, но обязательна она в двух случаях — при возможных разночтениях и в именах собственных. В гайдах Ё используется везде.\n- **Знак рубля** — всегда ₽, не «руб.» и не «р.». Хоткей: `⌥ + 8` (MacOS) или `⌥ + р` (раскладка Бирмана).\n- **Знак номера** — №, а не решётка (#); номер отделяется от знака пробелом.\n- **Знаки валют**: для русскоязычной аудитории знак ставится после числа (это отличается от традиций некоторых других стран) и отделяется неразрывным пробелом обычной ширины.\n- **Проценты и процентные пункты**: процент — доля от целого, процентный пункт — разница между значениями в процентах (например, рост ставки с 6 до 8 % — это рост на 2 процентных пункта, но на 33 процента от исходного значения). Процентный пункт обозначается как «% п.» или «п. п.».\n\n## Кавычки\n\n- В русскоязычном тексте — кавычки-ёлочки («…»); в англоязычных сервисах — кавычки-лапки, двойные (“…”) и одинарные (‘…’).\n- Для второго уровня вложенности (цитата внутри кавычек, слово в переносном смысле, обращение к объекту через родовое слово) используются кавычки-лапки „…“.\n- Прямые кавычки (" ") не используются — это инструмент сред разработки, а не типографики для людей.\n\n## Цифры\n\n- Моноширинные цифры используются для выравнивания чисел в таблицах и списках. Рекомендуется включать их сразу во всём продукте, а не точечно.\n- В Figma: отсоединить стиль текстового слоя → вкладка Details → в блоке Numbers переключить Style на Monospace uppercase / Lining.\n- В CSS: `font-variant-numeric: lining-nums tabular-nums;`\n\n## Арифметические знаки\n\n- Плюс (+) и минус (−) обозначают знак числа (не отделяются от числа) либо арифметическое действие (отделяются от чисел пробелом).\n- Важно использовать именно знак минуса, а не тире или дефис — у минуса правильная ширина (как у цифры) и вертикальное выравнивание по центру прописных букв.\n- Плюс-минус (±) и тильда (~) обозначают приблизительное значение и не отделяются от числа.\n- Знаки равенства (=), умножения (×) и деления (÷) используются в арифметических выражениях и отделяются от чисел пробелом.\n- Не используйте букву «Х» или звёздочку (*) вместо знака умножения и слеш (/) вместо знака деления.\n- Хоткеи: `≠` — `⌥ + =`; `±` — `shift + =`; `−` — `⌥ + -` (MacOS) / `⌥ + m` (Бирман); `×` — `⌥ + 9` (MacOS) / `⌥ + x` (Бирман); `÷` — `⌥ + \\` (только MacOS).\n\n## Дефис и тире\n\n- **Дефис (-)** — орфографический знак внутри слова: составные слова, перенос по слогам, сокращения по первой и последней букве.\n- **Тире (—)** — пунктуационный знак между словами и числами: интервалы значений и дат (числовой интервал — без пробелов вокруг тире, словесный — с пробелами), прямая речь, определения понятий, переход от причины к следствию.\n- Тире также используется как прочерк при отсутствии данных — это не то же самое, что ноль. Не выводите 0 вместо отсутствующих данных, но и не оставляйте пустое место (это ломает вёрстку) — используйте серое тире.\n- Не различайте короткое и длинное тире по стилистическим правилам — это условность для печатных изданий. В веб-сервисе используйте одно (длинное) тире.\n\n## Правила набора чисел\n\n- Разряды в числах отделяются неразрывным пробелом обычной ширины, включая четырёхзначные числа.\n- Дробная часть отделяется от целой запятой, а не точкой (в англоязычных сервисах — наоборот, точкой).\n- Используйте одинаковое количество десятичных знаков для одних и тех же данных по всему сервису.\n- Наращение суффикса допустимо только для порядковых числительных: если перед последней буквой согласный звук — наращиваются две буквы, если гласный — одна.\n\n## Номера\n\n- Номера документов не разбиваются на группы.\n- Если номер записан словами, знак № не используется.\n- Телефонные номера набираются полностью, с неразрывными пробелами и дефисами; код сети не заключается в скобки (его нельзя опустить). Для столбцов номеров — моноширинные цифры.\n- ИНН и КПП пишутся через тире.\n- Номера банковских счетов разделяются по смыслу (по ним можно понять валюту и владельца счёта).\n- Номера банковских карт разбиваются на группы по 4 цифры, разделённые неразрывным пробелом.\n\n## Дата и время\n\n- В численной записи: день/месяц/год разделяются точками, часы/минуты/секунды — двоеточиями, между датой и временем — запятая.\n- Формат записи выбирается по месту: в узкой колонке таблицы уместна численная запись, в предложении — полный текстовый формат со словом «год».\n- Пробелы в дате — неразрывные.\n- День недели и относительные значения («сегодня», «вчера») отделяются от даты запятой; если они стоят рядом с датой, месяц пишется словом.\n\n## Адреса, инициалы и сокращения\n\n- Между обозначением части адреса и значением — неразрывный пробел.\n- Между инициалами пробела нет, а между инициалами и фамилией — неразрывный пробел.\n- В устойчивых сокращениях («и т. д.», «и т. п.») после союза — неразрывный пробел, между сокращёнными словами пробела нет.\n\n## Предложение, абзац и подпись\n\n- Если текст в интерфейсе выглядит как подпись (а не абзац) — точка в конце не нужна, даже вне контрола, посреди формы.\n- В заголовках точка ставится только между предложениями (не в конце одиночного заголовка).\n- Вопросительный знак в заголовке нужен только тогда, когда пользователю реально задают вопрос. Если в заголовке есть вопросительное слово, но пользователю ничего не сообщается вопросом (наоборот, ему рассказывают) — знак не нужен.\n\n## Капс и капитель\n\n- Набор капсом (прописными без разрядки) **запрещён**: у прописных букв нет выносных элементов, слово хуже узнаётся по форме, а капс воспринимается как повышение тона.\n- Псевдокапитель (прописные + более жирное начертание + больший размер + небольшая разрядка) допустима для мелких элементов интерфейса, которым не хватает веса, если увеличить размер текста нельзя (например, рубрикация списков и навигации).\n\n## Списки\n\n- Два способа набора: (1) классический — список как одно предложение, разбитое на строки, с двоеточием после общей части, запятой/точкой с запятой после элементов и точкой в конце; (2) список как набор элементов — жирный заголовок + элементы без знаков препинания.\n- Не смешивайте эти два стиля.\n- В классическом способе элементы должны быть согласованы с началом списка (это одно предложение).\n- Элемент списка не обязан начинаться с буллита или тире.\n- В обоих способах допустим абзацный отступ между началом списка и первым элементом.\n\n## Скрытие данных\n\n- Для скрытия части номеров и других личных данных используйте Middle Dot (·) — обычную точку, а не жирный буллит.\n\n## Сокращения\n\n**Календарные периоды:** секунда → с; минута → мин.; час → ч.; день → д.; неделя → нед.; месяц → мес.; квартал → кв.; год → г. (секунда — без точки, так как входит в СИ).\n\n**Месяцы** (первые три буквы, без точки): янв, фев, мар, апр, май, июн, июл, авг, сен, окт, ноя, дек.\n\n**Дни недели** (две буквы, с точкой): пн., вт., ср., чт., пт., сб., вс.\n\n**Единицы информации:**\n\n- Память: бит — б; байт — Б; килобайт — КБ; мегабайт — МБ; гигабайт — ГБ.\n- Пропускная способность (бит/с): бит/с, Кбит/с, Мбит/с, Гбит/с.\n- Скорость загрузки (байт/с, в 8 раз меньше пропускной способности): Б/с, КБ/с, МБ/с, ГБ/с.\n',

          "# Простые слова — правила Редполитики\n\n## Заменяем причастия и деепричастия на глаголы\n\nПричастные и деепричастные обороты усложняют предложение. То же касается отглагольных существительных — они несут тот же смысл, что и глагол, но утяжеляют текст.\n\n- «Проводим обучение новых поставщиков» → «Обучаем новых поставщиков»\n- «Обратитесь к экспертам, разъясняющим изменения в законодательстве» → «Эксперты разъяснят изменения в законодательстве»\n- «Бухгалтер, совершенствуя свои навыки, со временем может успевать больше» → «Бухгалтер со стажем успевает больше, чем новичок»\n\n## Избегаем составных сказуемых\n\nВ конструкциях вроде «осуществляет продажу», «является обязательным» смысл несёт только одно слово. Меняем конструкцию: если есть действие — оставляем один глагол, если описываем ситуацию — ищем существительное или прилагательное.\n\n- «Регистрация в системе является обязательной» → «Регистрация в системе обязательна»\n- «Ответственным лицом является директор» → «Ответственное лицо — директор»\n- «Совершить обзвон клиентов» → «Позвонить клиентам»\n\n## Избавляемся от страдательного залога\n\nСтрадательный залог скрывает действующее лицо — это размывает картину происходящего или позволяет уйти от ответственности.\n\n- «Вам открыт доступ» → «Мы открыли вам доступ»\n- «Клиентом заключён договор с компанией» → «Клиент заключил договор с компанией»\n- «С 15 апреля по 8 мая 2020 года установлены нерабочие дни» → «Дни с 15 апреля по 8 мая — нерабочие»\n- «У вас приближается срок продления услуг Диадока» → «Продлите Диадок до 15 июня»\n\n## Не используем канцеляризмы\n\nКанцелярит усложняет текст и отдаляет автора от читателя. Клиенты и так постоянно читают сложные законы и договоры — не стоит усложнять им жизнь ещё больше.\n\n| Канцеляризм                  | Заменяем на      |\n| ---------------------------- | ---------------- |\n| во избежание                 | чтобы            |\n| посредством                  | через, с помощью |\n| в целях                      | чтобы            |\n| данное решение               | решение          |\n| в связи                      | из-за            |\n| при условии наличия          | если есть        |\n| путём голосования            | голосованием     |\n| по окончании                 | когда закончится |\n| соответствующий запрос       | запрос           |\n| функционал, функциональность | возможности      |\n\n## Вместо оценок даём факты\n\nМы не решаем за читателя, что ему думать, — а показываем факты, чтобы он сам сделал вывод.\n\n- «Компания с огромным опытом» → «Мы на рынке 31 год»\n- «Лидер отрасли» → «С 2011 года занимаем первое место среди SaaS-поставщиков России по объёму выручки (CNews)»\n\n## Штампы заменяем конкретикой или удаляем\n\nИз корпоративных и газетных штампов читатель не узнаёт ничего нового — это белый шум, который хочется побыстрее пролистать. Лучше сказать конкретно и по делу.\n\n- «В ближайшее время» → «25 мая» / «Как только примут законопроект»\n- «Взрывной рост выручки» → «За месяц выручка выросла в два раза»\n- «Доброго времени суток» → «Здравствуйте!», «Добрый день!»\n- «Ни для кого не секрет» → не используем совсем\n- «С уважением к вам и вашему бизнесу» → не используем совсем\n- «С надеждой на долгое сотрудничество» → не используем совсем\n- «Желаю процветания» → не используем совсем\n- «Заранее спасибо» → не используем совсем\n\n## Не нагромождаем существительные\n\nКогда в предложении много понятий и мало действия, сложно добраться до сути. Ещё хуже, если существительные нанизываются друг на друга. Заменяем их глаголами, ищем лаконичные формулировки.\n\n- «Есть варианты реализации пользовательского процесса удобным образом» → «Этот сценарий можно сделать удобным для пользователя»\n- «Утверждён новый порядок расчёта пособия по нетрудоспособности» → «Пособия по нетрудоспособности рассчитываем по-новому»\n",
        "https://in.kontur.ru/text/48075-sameness":
          "# Спорные слова — правила Редполитики\n\n## Устоявшиеся заимствования пишем по-русски\n\nПопулярные иностранные слова и аббревиатуры, которые уже приняты словарями и используются большинством людей, пишем по-русски, с маленькой буквы (это не имена собственные, а названия широкого круга явлений).\n\n- SMS → смс\n- web-камера → веб-камера, камера на ноутбуке\n- Online → онлайн, онлайн-\n- Deadline → дедлайн\n- call-центр → колл-центр\n- Исключение: email (а не e-mail или имейл)\n\nГрейды можно называть и по-английски, и по-русски. На русском используем: **джун, мидл, сеньор** (не «джуниор»/junior, не «миддл»/middle, не «синьор»/«сениор»/senior).\n\n## Неосвоенное — по-английски\n\nИностранные аббревиатуры, слова и словосочетания, которые ещё не вошли в язык и на практике пишутся по-разному, оставляем на английском — это иногда помогает избежать путаницы в толковании.\n\n- ИТ, IT-технологии → **IT**\n- АПИ → **API**\n- Бигдата, Большие данные → **Big Data**\n\nДля слов, не попавших в таблицу: если англоязычное написание распространено больше или наравне с русскоязычным, проект выбирает написание сам (проверить популярность можно в Вордстате) — но важно быть последовательным и писать одинаково везде.\n\n## Не используем англицизмы\n\nЕсли у заимствования есть лаконичный русский аналог — пишем по-русски. Необоснованные заимствования засоряют речь и делают её малопонятной.\n\n- пролонгирование → продление\n- митинг → встреча\n- ресерч, рисерч → исследование\n- аттачить → прикрепить к письму\n- паблик релейшнз → связи с общественностью, PR\n- фидбэк → обратная связь, отзывы\n- роадмап → дорожная карта, план работы\n\nВнутри Контура профессиональные жаргонизмы (бэклог, юзер, фронтенд, утилита) исключить из речи нельзя, но с внешней аудиторией нужно общаться на понятном большинству языке.\n\n## Сложносоставные слова пишем слитно\n\nСлова, образованные по модели «существительное + подчинённое слово» (физическое лицо → физлицо, государственная поддержка → господдержка), пишем слитно — без точек и дефисов.\n\n- юр. лица → юрлица\n- корп. сегмент → корпсегмент\n- масс. сегмент → массегмент\n- штрих. код → штрихкод\n- промо-акция → промоакция\n- демо-версия → демоверсия\n- мед. учреждение → медучреждение\n- доп.соглашение → допсоглашение\n\nЕсли второй корень начинается с гласной и слитное написание звучит неблагозвучно, слово можно развернуть в словосочетание: персучёт → персонифицированный учёт, туриндустрия → туристическая индустрия, допусловия → дополнительные условия.\n\n## Сложносоставные из двух или трёх иностранных слов — через дефис\n\nСловари пока не утвердили орфографическую норму для таких слов, поэтому выбираем дефисное написание.\n\n- конфколл → конф-колл\n- роллап → ролл-ап\n- сервиспак → сервис-пак\n- коллцентр → колл-центр\n\nТрёхкорневые сложносоставные слова неудобно читать слитно. Если одно из слов можно считать отдельным термином, цепляем его к следующему через дефис (по аналогии с «бизнес-задача», «онлайн-встреча»):\n\n- финтехстартап → финтех-стартап\n- физтехкласс → физтех-класс\n- хайтекпроект → хайтек-проект\n- ноунеймпродукт → ноунейм-продукт\n\n## Сервис уже подразумевает онлайн\n\nГоворим просто «сервис», а не «веб-сервис» или «онлайн-сервис» (эти варианты допустимы, только если важно подчеркнуть, что система работает из браузера). Не путаем сервисы и программы:\n\n- **Сервисы** — работают из браузера: Диадок, Экстерн, Фокус, Закупки, сервис Бухгалтерия и подобные.\n- **Программы** (десктопные продукты) — устанавливаются на компьютер и могут работать без интернета: Персонал, Зарплата, Бухгалтерия Бюджет и Бухгалтерия Актив и их модули.\n\n## Не усложняем общепринятые сокращения\n\nЕсть сокращения, употребление которых расходится с правилами русского языка — ФИО и «мск» (для часового пояса).\n\n- ФИО пишем без точек между буквами — так легче читать, и это написание встречается чаще: «Укажите Ф.И.О. сотрудника» → «Укажите ФИО сотрудника».\n- Часовой пояс обозначаем строчными буквами — по аналогии с «млрд», «млн»: «Вебинар пройдёт в 12:00 (МСК)» → «Вебинар пройдёт в 12:00 мск»; «Вебинар пройдёт в 12:00 по МСК времени» → «Вебинар пройдёт в 12:00 по мск времени».\n",
        "https://in.kontur.ru/text/48087-letters":
          '# Буквы — правила Редполитики\n\n## Не «Вы», а «вы»\n\nОбращаемся к клиенту на «вы», а не на «Вы». Уважение передаём не заглавной буквой, а смыслом и тональностью текста.\n\n- «Курьер приедет к Вам, ожидайте» → «Курьер приедет к вам в 16:00 и позвонит за 20 минут до приезда»\n- «Мы отключим Вашу подписку на сервис, если Вы не оплатите счёт» → «Срок вашей подписки на сервис истекает 25 мая. Чтобы продолжить пользоваться сервисом, продлите подписку. Счёт во вложении»\n- «Уникальное предложение исключительно для Вас!» → «Контур запускает акцию — при покупке Экстерна вы получаете доступ ко всем вебинарам Школы бухгалтеров»\n\n## «Ё» в разночтениях\n\nОбязательно пишем Ё в двух случаях:\n\n- там, где возможны разночтения («Все всё поняли?» вместо «Все все поняли?»);\n- в именах собственных, если Ё закреплено в документах или официальном названии компании («Контур.Взаиморасчёты», «Детский сад "Ёжик"»).\n\nВ остальных случаях написание — на усмотрение автора, но важна последовательность: если Ё расставлена по всему тексту, делайте так же и в других материалах.\n\n## «Е» или «Э»\n\nВ заимствованных словах после твёрдой согласной пишем «е», а не «э» — это правило фиксируют несколько словарей.\n\n- лэндинг → лендинг\n- тэг → тег\n- хэштег → хештег\n- фронтэнд → фронтенд\n- вэбинар → вебинар\n- слэш → слеш\n- кешбэк — уже пишется через «е»\n\nИсключений много: устоявшиеся слова (мэр, мэтр, пленэр, сэр) и новые (кэш, хэш, лэптоп, бэк-вокал, бэкграунд и другие производные от «бэк-»). При выборе буквы нужно обращаться к орфографическому словарю и порталу ГРАМОТА.РУ.\n\nТакже «Е» пишется в середине корня после «и» (риелтор, абитуриент), а в начале корня — «Э» (полиэтилен, восьмиэтажный). В других спорных случаях Е/Э — по справочнику Д. Э. Розенталя.\n\n## С маленькой буквы всё, кроме имён собственных и федеральных властей\n\nНагромождение заглавных букв затрудняет чтение. Со строчной буквы пишем названия должностей, областные и городские органы власти, слова «клиент», «заказчик» и подобные.\n\nС заглавной буквы пишется первое слово в названиях федеральных органов власти: Госдума, Совет федерации, Правительство РФ.\n\n- «В четверг Президент оставил Поручение Председателю Правительства Михаилу Мишустину» → «В четверг президент оставил поручение председателю Правительства Михаилу Мишустину»\n- «Отрасли перечислены в Перечне из Постановления Правительства РФ» → «Отрасли перечислены в перечне из постановления Правительства РФ»\n- «Оплатите счёт в Банке» → «Оплатите счёт в банке»\n- «Найду эту информацию в Интернете» → «Найду эту информацию в интернете»\n- «Отправьте этот Договор Заказчику» → «Отправьте этот договор заказчику»\n- «Сотни аккредитованных Удостоверяющих центров» → «Сотни аккредитованных удостоверяющих центров»\n\nИсключение — название собственного удостоверяющего центра Контура пишется с большой буквы: «акция от Удостоверяющего центра Контура».\n\nЭто же правило действует для статей о внутренних документах компании и отделах:\n\n- «Читайте в Стандарте оснащения офисов компании от Отдела по работе с филиалами и дочерними организациями» → «Читайте в стандарте оснащения офисов компании от отдела по работе с филиалами и дочерними организациями»\n- «Это проект Центра Компетенций» → «Это проект центра компетенций»\n- «Результаты работы Управления Клиентского сервиса» → «Результаты работы управления клиентского сервиса»\n',
        "https://in.kontur.ru/text/48088-numbers":
          "# Числа и валюта — правила Редполитики\n\n## Числа до 10 пишем словами\n\nИсключения — перечисление нескольких чисел, валюта или текст в дизайне; в этих случаях решение принимает автор или дизайнер.\n\n- «Поправки вступят в силу в течение 2 месяцев» → «Поправки вступят в силу в течение двух месяцев»\n- «В аукционе участвовали 3 компании» → «В аукционе участвовали три компании»\n- Исключения: «Срок размещения извещения — 7-15 календарных дней» (перечисление чисел); «Три / 3 месяца подписки бесплатно», «Если начальная цена контракта меньше трёх / 3 млн рублей…» (решает автор)\n\nКварталы можно записывать как удобно — римскими (IV квартал), арабскими цифрами (4 квартал) или словом (четвёртый квартал). То же касается дат (третье октября или 3 октября). Главное — быть последовательным и использовать один способ во всех текстах.\n\n## После цифры не наращиваем буквы\n\nНаращение окончаний усложняет текст, а с окончаниями легко ошибиться.\n\n- «Оплатите в течение 3-х дней» → «Оплатите в течение трёх дней»\n- «Отчитайтесь до конца 2020-го года» → «Отчитайтесь до конца 2020 года»\n- «3х-мерное изображение» → «Трёхмерное изображение»\n- «В 11-м году» → «В 2011 году»\n\n## Сокращаем числа, если точность не важна\n\nИспользуем обозначения «тыс.», «млн», «млрд». Точку ставим только после «тыс.».\n\n- «У нас 101 307 клиентов. Уже даже больше» → «У нас больше 100 тыс. клиентов»\n- «ГК СКБ Контур заработала 14 123 456 789 рублей» → «ГК СКБ Контур заработала 14,1 млрд рублей»\n\nПосле запятой оставляем максимум один знак: «За прошлый год заработали 12,987 млрд рублей, а за этот — 14,123 млрд рублей» → «За прошлый год заработали 13 млрд рублей, а за этот — 14,1 млрд рублей».\n\n## Единообразие в валютах\n\nВалюту можно обозначать словом («рубль»), сокращением («руб.») или знаком (₽) — но важно соблюдать единообразие в пределах одного текста, не смешивать варианты.\n\n- «С зарплаты 20 000 ₽ вы заплатите 2 600 рублей НДФЛ» → «С зарплаты 20 000 рублей вы заплатите 2 600 рублей НДФЛ»\n- Правильно единообразно: «С зарплаты 20 000 ₽ вы заплатите 2 600 ₽ НДФЛ» или «С зарплаты 20 000 руб. вы заплатите 2 600 руб. НДФЛ»\n\n## Пробелы между цифрами и %\n\nВ пяти-, шестизначных и более длинных числах между разрядами добавляем пробел: 20 000, 340 000. В четырёхзначных числах пробел рекомендуется, но допустимо и без него — главное единообразие в пределах текстов одного продукта: 4 000 (рекомендуем) или 4000 (допускаем при единообразии). В идеале пробел должен быть неразрывным.\n\n- «20000 ₽» → «20 000 ₽»\n- Допустимо: «4 000 ₽» или «4000 ₽»\n\nЗнак % отделяется от числа неразрывным пробелом: «В первом квартале количество госзакупок выросло на 13%» → «В первом квартале количество госзакупок выросло на 13 %».\n",
        "https://in.kontur.ru/text/48089-companies":
          '# Названия компаний — правила Редполитики\n\n## Другие компании называем так, как они хотят\n\nПишем название так, как компания сама себя называет в русском инфополе, — это касается заглавных букв, точек, тире и кавычек. Проверить официальное название можно на сайте самой компании.\n\n- «Честный знак» → Честный знак\n- Икея → ИКЕА\n- «Т-банк» → Т-Банк\n- Тензор → «Тензор»\n\nЕсли речь о вымышленной компании (для иллюстрации статьи) или неизвестно правильное оформление — заключаем название в кавычки и не используем капс, то есть оформляем по общим правилам русского языка: «Кулинария ПекАрушка и ИП "Василькин"» → «Кулинария "Пекарушка" и ИП Василькин».\n\n## Иностранные компании называем без кавычек и так, как они хотят\n\nИспользуем официальное название — то, что написано на логотипе или официальном сайте. Иностранные слова в кавычки не заключаем.\n\n- Хендай, «Hyundai Motor Company» → Hyundai Motor Company\n- «Контур и "Vivienne Sabò" протестировали маркировку парфюмерии» → «Контур и Vivienne Sabò протестировали маркировку парфюмерии»\n\nЕсли речь о российском филиале иностранной компании, используем его официальное русифицированное название, при необходимости поясняя, к какому бренду он относится:\n\n- IKEA → ИКЕА\n- «Hyundai Motor Company внедрила систему Диадок» → «"Хендэ Мотор Мануфактуринг Рус" — завод Hyundai Motor Company в России. Он внедрил у себя сервис Контур.Диадок»\n\n## Не указываем форму собственности компаний\n\nПишем официальное название компании без АО, ООО, ПФ и прочих реквизитов. Исключение — счёт на оплату, официальный документ или случаи, когда форма собственности важна для контекста (например, статья про переход с ООО на ИП).\n\n- «Контур запустил электронный документооборот в ООО "Ситилинк"» → «Контур запустил электронный документооборот в компании "Ситилинк"»\n- «Рассмотрим на примере: ООО "Пекарушка" передало товар ИП Иванков, однако оплаты не получило» → «Рассмотрим на примере: "Пекарушка" передала товар в кулинарию, однако оплаты не получила»\n',
        "https://in.kontur.ru/text/48090-law":
          '# Названия законов и сервисов — правила Редполитики\n\n## Сокращаем названия законов\n\nПолные официальные названия законов и нормативных актов не пишем — они могут занимать целый абзац, но не несут пользы: чтобы найти текст закона, достаточно знать краткие реквизиты.\n\n- При первом упоминании даём номер закона, дату и, если возможно, ссылку на Контур.Норматив. При повторном упоминании оставляем только номер.\n- Если текст адресован читателю, который точно понимает контекст (например, поставщику закупок по 44-ФЗ), можно сразу указывать только номер закона.\n\nПример: «Ситуации, в которых можно расторгнуть госконтракт, устанавливает Федеральный закон от 05.04.2013 № 44-ФЗ "О контрактной системе в сфере закупок…"» → при первом упоминании: «…устанавливает Федеральный закон от 05.04.2013 № 44-ФЗ. В 44-ФЗ прописано, что…» → при повторном/для знающего читателя: «…устанавливает 44-ФЗ».\n\nЕсли для контекста важно указать тематику закона — при первом упоминании даём сокращённое название (не больше пяти слов): «Федерального закона от 07.08.2001 № 115-ФЗ "О противодействии легализации (отмыванию) доходов, полученных преступным путём, и финансированию терроризма"» → «Федерального закона от 07.08.2001 № 115-ФЗ "О противодействии отмыванию доходов"».\n\nЕсли ссылаемся на конкретное положение — кратко указываем от пункта к номеру закона: «ч. 2 ст. 62 218-ФЗ».\n\nНормативно-правовые акты (постановление, распоряжение, письмо) по общему правилу пишем со строчной буквы. Писать с заглавной допустимо, только если это соблюдается во всех текстах продукта. Название государственного органа всегда начинается с заглавной буквы.\n\n- «Отрасли перечислены в Перечне из Постановления Правительства РФ» → «Отрасли перечислены в перечне из постановления Правительства РФ» (или «…из Постановления Правительства РФ», если такое написание принято во всех текстах продукта)\n\n## Русифицируем названия соцсетей, сторонних программ и сервисов\n\nНазвания известных мессенджеров и соцсетей пишем по-русски, без кавычек — эти слова прочно вошли в обиход, а незнакомое слово легко нагуглить и на кириллице. Заглавная или строчная буква — решает каждый продукт сам, но последовательно.\n\n- «Вконтакте» → вконтакте / Вконтакте\n- Skype → скайп / Скайп\n- WhatsApp → ватсап / Ватсап\n- Viber → вайбер / Вайбер\n- Zoom → зум / Зум\n- Telegram → телеграм / Телеграм\n- YouTube, Ютьюб → Ютуб\n- Yandex → Яндекс\n- Google → Гугл\n\nИсключения:\n\n- Word, Excel — вошли в употребление именно в таком (английском) виде\n- email — а не имейл или e-mail\n\nНазвания специализированных программ пишем так, как их называют сами производители: КриптоПро CSP, ViPNet CSP 4, API.\n\n## Заимствованные профессиональные термины чаще пишем на английском\n\n- **Профессиональные термины из IT-сферы** первое время живут на английском: Big Data, Data Science, API, Android, Scrum, frontend-разработчик.\n- **Общеупотребительные слова** пишутся по-русски и транслитерируются максимально близко к оригинальному произношению: локдаун, колл-центр, сторис.\n- Со временем слово «обрусевает» и упрощается (билборд, офлайн, офер) — так, вероятно, однажды устоится и написание «датасайентисты оптимизировали работу колцентра».\n\n## Как пишем названия акций\n\nПервое слово названия акции — с заглавной буквы, как у любого праздника или события (Новый год, День сантехника). Кавычки не нужны — это не переносное значение, не имя-фамилия и не единичное историческое событие.\n\n- «Черная Пятница» → Черная пятница\n- «УЛЕТНЫЙ понедельник» → Улетный понедельник\n- «Большая Распродажа» → Большая распродажа\n- «День Скидок» → День скидок\n',
        "https://in.kontur.ru/text/48091-sign":
          "# Знаки — правила Редполитики\n\n## Не кричим на пользователей капсом\n\nКапс можно воспринять как агрессивный тон. Исключение — официальные названия (например, «Честный ЗНАК»).\n\n- «Электронная подпись выдаётся ТОЛЬКО ПРИ НАЛИЧИИ ПАСПОРТА» → «Важно: подпись не получится выпустить без оригинала паспорта, не забудьте взять его с собой»\n\n## Умеренно используем восклицательные знаки\n\nМножественные восклицательные знаки выглядят непрофессионально и воспринимаются как навязчивая реклама, сверхэмоция или агрессия.\n\n- «Внимание!!! Новый тариф Бизнес Плюс доступен уже сейчас!!! Успейте подключить со скидкой 50%!!! Только до конца недели!!!» → «Новый тариф Бизнес Плюс уже доступен. Успейте подключить со скидкой 50% до 27 мая»\n\n## Правильные «кавычки»\n\nИспользуем кавычки-ёлочки «…». Внутри них — кавычки-лапки „…“ или кавычки того же рисунка, но тогда закрывающая кавычка ставится только одна, в самом конце всей фразы, а не после каждого вложенного слова.\n\n- Пример: «Как ритейлу передавать данные в Честный знак: кейс сети „Магнит“»\n\n## Тире, дефис и минус — три разных знака\n\n- **Длинное тире (—)** — ставится между словами, как в этом предложении, отделяется пробелами с обеих сторон; используется и в списках. «Маркировка - система…» → «Маркировка — система цифровой прослеживаемости товаров с помощью кодов Data Matrix»\n- **Короткое тире (–)** — используется без пробелов между цифрами для пространственных и временных диапазонов: «10-15%» → «10–15%»; «7–15 рабочих дней»\n- **Дефис (-)** — стоит внутри двойных слов: «бизнес процессы» → «бизнес-процессы»; «что-то»\n- **Минус (−)** — математический знак, используется только в формулах и для отрицательных величин: −17%. Заменять им тире в числовых диапазонах нельзя.\n\n## Избегаем слеша\n\nЗаменяем слеш на предлог или союз — так текст читается естественнее.\n\n- «Закажите лицензию на программу КриптоПро и/или токен» → «Закажите лицензию на программу КриптоПро или токен»\n- «57 000 рублей / год» → «57 000 рублей в год»\n\n## Ссылки зашиваем в текст\n\nСсылку встраиваем в слово или фразу, а не показываем целиком. Исключение — печатные материалы, презентации или изображения, но и там убираем хвост «https://».\n\n- «Список пострадавших отраслей можно посмотреть в нашей статье: https://e-kontur.ru/enquiry/1489/post...» → «Список пострадавших отраслей можно посмотреть в нашей статье» (ссылка зашита в слова «нашей статье»)\n- Для печатных материалов: «Заявку оставьте на kontur.ru/extern» (без https://)\n\n## Оформление списков\n\n- Маркированный список оформляем длинным тире «—». Для пошаговых действий используем нумерацию: «1. 2. 3. …».\n- Если пункты — полноценные предложения: каждый начинаем с заглавной буквы и заканчиваем точкой.\n- Если пункты состоят из одного или нескольких слов (без внутренней пунктуации): начинаем со строчной буквы, в конце каждого пункта — запятая, в конце последнего — точка.\n- Если внутри пунктов уже есть знаки препинания: в конце каждого пункта ставим точку с запятой.\n- В печатной продукции, на картинках, в коммерческих материалах и презентациях знаки препинания в конце пунктов можно не ставить.\n\n## Смайлик приравниваем к знаку препинания\n\nЕсли после текста нужен свой знак препинания (например, вопросительный или восклицательный) — ставим смайлик после него, а не вместо него и не перед ним.\n\n- «Главное, что отчёт ушёл вовремя :).» → «Главное, что отчёт ушёл вовремя :)»\n- «Мы рады, что смогли вам помочь:)!» → «Мы рады, что смогли вам помочь! :)»\n",

енения длины/тона\n   - **Сократить** — та же мысль короче, без потери смысла\n   - **Сделать четче** — убрать двусмысленность и общие слова, оставить конкретику\n   - **Сделать дружелюбнее** — смягчить тон, не теряя конкретику (см. «Тон и голос» в сводке)\n     Если режим не указан явно — предложи 2–3 варианта в разных режимах и спроси, какой ближе.\n\n## Гоучи\n\n- **Не путай «Редактор» с «Полным анализом»**: здесь не нужна оценка 0–10 и общий индекс качества —\n  это отдельный режим плагина (full-analysis-text). Если пользователь просит и оценку, и правку —\n  сначала спроси, нужен полный аудит или точечная правка.\n- **Тосты/хинты/тултипы-подписи не заканчиваются точкой**, если это одно предложение — модель\n  систематически добавляет точку по умолчанию, проверяй тип фрагмента перед финальным ответом.\n- **«Вы» со строчной буквы** даже в вежливой формулировке — не путай с орфографическим Вы из\n  официальных писем, это разные регистры.\n- Если фрагмент — кнопка подтверждения удаления/необратимого действия, формулировка должна называть\n  конкретное последствие («Удалить доверенность для ООО "Ромашка"»), а не быть общим «Да»/«Продолжить».\n- Не сокращай ради сокращения: краткость должна сохранять баланс «простота + краткость + польза»\n  (см. «Основные правила» в сводке) — если сокращение теряет нужную пользователю деталь, это не\n  победа.',

            "# Полный анализ текста по редполитике Контура\n\nАналог режима «Полный анализ» плагина «Просто редактор»: пользователь даёт связный текстовый\nблок целиком (не выбирает один элемент заранее), и нужна общая оценка + список замечаний по всем\nгруппам правил, а не разбор одного знака препинания.\n\n## Что делать\n\n1. Прочитай весь текст целиком и определи его тип (экран, письмо, попап, серия тостов) — это\n   влияет на применимые правила (тон робота vs Контура, пунктуация подписей vs абзацев).\n2. Проверь текст по сводному документу\n   [`../../../references/editorial-policy/svodnye-pravila-po-gruppam.md`](../../../references/editorial-policy/svodnye-pravila-po-gruppam.md) —\n   это единственный источник, по которому в плагине считается индекс качества, он покрывает все\n   группы правил одним файлом.\n3. Для неоднозначных случаев (спорное слово, точное написание чужого названия, редкий формат\n   числа) уточни в специализированном источнике, а не гадай по сводке:\n   - [`../../../references/editorial-policy/disputed-words-rules.md`](../../../references/editorial-policy/disputed-words-rules.md)\n   - [`../../../references/editorial-policy/company-names-rules.md`](../../../references/editorial-policy/company-names-rules.md)\n   - [`../../../references/editorial-policy/laws-services-names-rules.md`](../../../references/editorial-policy/laws-services-names-rules.md)\n   - [`../../../references/editorial-policy/simple-words-rules.md`](../../../references/editorial-policy/simple-words-rules.md)\n   - [`../../../references/editorial-policy/osnovnye_pravila_teksta_v_interfeise.md`](../../../references/editorial-policy/osnovnye_pravila_teksta_v_interfeise.md) — базовая логика «зачем этот текст вообще нужен»\n4. Посчитай индекс качества 0–10 (ориентир по шкале плагина: 0–4 — серьёзные проблемы, 5–7 —\n   есть что доработать, 8–9 — почти готово, 10 — без замечаний) и оформи вывод:\n   - индекс + короткое обоснование\n   - список замечаний с **точной цитатой фрагмента** (не пересказом совета) и тегом группы правил\n     (типографика / простой язык / тон и голос / числа / названия / структура)\n   - при необходимости — 1–2 предложенных варианта правки на самое серьёзное замечание\n5. Если пользователь после этого просит переписать конкретный найденный фрагмент — это уже\n   задача only-editor, передай/предложи точечную правку в его логике режимов.\n\n## Гоучи\n\n- **Не занижай и не завышай индекс из вежливости** — если в тексте капс, наращения окончаний\n  («3-х дней») или страдательный залог там, где должен говорить Контур от первого лица, это\n  минимум −2 к индексу по опыту разметки; не сглаживай оценку до «в целом неплохо».\n- **Цитируй фрагмент дословно**, а не своими словами — в интерфейсе плагина подсветка проблемного\n  места работает только по точному совпадению строки с текстом на макете.\n- **Не путай «Под запретом» и «Простой язык»** как теги — капс/кавычки/наращения это типографика\n  и категорические запреты, а канцеляризмы и штампы — про упрощение синтаксиса; разные советы для\n  разных исправлений.\n- **Различай модальность «робот» vs «Контур»** прежде чем ругать текст за страдательный залог —\n  в коротких технических уведомлениях о результате действия страдательный залог допустим и это\n  не ошибка (см. «Тон и голос» в сводке), ошибка — только если так же написано объясняющее письмо.\n- Если текст — это подтверждение необратимого действия, отдельно проверь, называет ли кнопка\n  конкретное последствие, а не общее «Да» — это частое замечание, которое легко пропустить,\n  сосредоточившись только на самом тексте сообщения.",

        '# Сводные правила текста и типографики Контура\n\nИсточники: «Текст в интерфейсе», «Экранная типографика», «Простые слова», «Спорные слова», «Буквы», «Числа и валюта», «Названия компаний», «Названия законов и сервисов».\n\n---\n\n## 🚫 Под запретом\n\n1. **Капс** (прописные без разрядки) для акцента в тексте — слово хуже узнаётся по форме, а капс читается как повышение тона.\n2. **Прямые кавычки** `" "` — используем «ёлочки» или „лапки“.\n3. **Буква «Х» и звёздочка (\\*)** вместо знака умножения (×), **слеш (/)** вместо знака деления (÷).\n4. **Наращение окончаний после цифр**: «3-х дней», «2020-го года», «в 11-м году» → «трёх дней», «2020 года», «в 2011 году».\n5. **Ноль вместо отсутствующих данных** — если данных нет, используем тире-прочерк, а не 0 и не пустое место (ломает вёрстку).\n6. **«Вы» с заглавной буквы** в середине предложения — только строчная «вы».\n7. **Форма собственности компаний** (ООО, АО, ИП) в обычном тексте — кроме счетов, документов и случаев, когда это важно по смыслу.\n\n## ✍️ Простой язык: синтаксис и лексика\n\n1. **Причастия/деепричастия и отглагольные существительные → глаголы**: «Обратитесь к экспертам, разъясняющим изменения» → «Эксперты разъяснят изменения».\n2. **Составные сказуемые → один глагол или прилагательное**: «Регистрация является обязательной» → «Регистрация обязательна».\n3. **Страдательный залог → действительный**, чтобы не скрывать действующее лицо: «Вам открыт доступ» → «Мы открыли вам доступ».\n4. **Канцеляризмы заменяем простыми словами**: «во избежание» → «чтобы», «посредством» → «через», «в связи» → «из-за».\n5. **Штампы и клише заменяем конкретикой или убираем**: «взрывной рост выручки» → «выручка выросла в 2 раза»; «Доброго времени суток», «Ни для кого не секрет», «Заранее спасибо» — не используем совсем.\n6. **Вместо оценок — факты**: «лидер отрасли» → «с 2011 года №1 по выручке среди SaaS-поставщиков (CNews)».\n7. **Не нагромождаем существительные подряд**: «варианты реализации пользовательского процесса» → «сценарий, удобный для пользователя».\n\n## 🔘 Кнопки и CTA\n\n1. Текст кнопки называет то самое действие, которое просит текст сообщения — не общее «ОК».\n2. Если в сообщении нет запроса на конкретное действие — кнопки предлагают сценарии, которые пользователь может выбрать сам.\n3. Слишком много кнопок — часть действий переносим в тело сообщения, оставляя в кнопках только необходимое.\n4. В подтверждении действия кнопка формулируется конкретно, отражая последствие: «Удалить доверенность для ООО "Ромашка"», а не просто «Да».\n5. Для частых или повторяющихся действий кнопка-подтверждение не нужна вовсе — вместо неё даём возможность отменить действие или восстановить данные.\n\n## 🔤 Типографика: знаки и пунктуация\n\n1. **Неразрывный пробел** — между числом и единицей измерения, инициалами и фамилией, после предлогов/союзов: `5 000 ₽`, `А. С. Пушкин`.\n2. **Кавычки**: «ёлочки» в русском тексте, „лапки“ — для второго уровня вложенности; в англоязычных сервисах — “…” и ‘…’.\n3. **Дефис vs тире**: дефис — внутри слова («по-новому»); тире (—) — между словами и числами («10—15 лет», «Волга — река»). Используем один вид тире (длинное), не делим на короткое/длинное.\n4. **Знак минуса (−)** — не тире и не дефис: у него правильная ширина (как у цифры) и центровка по прописным буквам.\n5. **Моноширинные цифры** — для выравнивания чисел в таблицах и списках (`font-variant-numeric: lining-nums tabular-nums;`).\n6. **Псевдокапитель** (прописные + жирнее + крупнее + небольшая разрядка) — единственная законная замена капсу, для мелких элементов навигации/рубрикации.\n7. **Точка в подписи**: в тостах, хинтах, заголовках и коротких сообщениях точка в конце не ставится, но ставится между предложениями внутри.\n8. **Скрытие данных** — Middle Dot (·), а не жирный буллит.\n\n## 🔢 Числа, даты и валюта\n\n1. **Числа до 10 — словами**: «в течение двух месяцев» (кроме перечислений, валюты и текста в дизайне).\n2. **Разряды чисел — неразрывным пробелом**: `20 000`, `340 000`; дробная част (не фидбэк).\n5. **Сложносоставные из русских слов — слитно**: юрлица, допсоглашение, штрихкод.\n6. **Сложносоставные из иностранных слов — через дефис**: конф-колл, финтех-стартап.\n7. **IT-профтермины первое время на английском** (Big Data, Scrum, frontend), общеупотребительные — транслитерируются (локдаун, сторис).\n8. **«Сервис» уже подразумевает онлайн** — не пишем «веб-сервис»/«онлайн-сервис», если не нужно подчеркнуть работу из браузера.\n\n## 🏢 Названия: компании, продукты, законы\n\n1. **Чужие компании — как они сами себя называют**: проверяем на официальном сайте («Честный знак», ИКЕА, Т-Банк).\n2. **Вымышленные/неясные названия** — оформляем по правилам русского языка, в кавычках, без капса.\n3. **Иностранные компании — без кавычек**, официальным написанием (Hyundai Motor Company); для российского филиала — русифицированное название.\n4. **«Контур» и названия продуктов склоняются** (кроме «СКБ Контур» — аббревиатура).\n5. **Названия законов сокращаем**: при первом упоминании — номер, дата, ссылка на Контур.Норматив; далее — только номер («44-ФЗ»).\n6. **Нормативные акты — со строчной** («постановление», «распоряжение»); государственный орган — всегда с заглавной.\n7. **Соцсети и мессенджеры — по-русски, без кавычек**: телеграм, вайбер, зум (искл. Word, Excel, email).\n8. **Названия акций** — с заглавной первой буквы, без кавычек: Черная пятница, День скидок.\n\n## 🪧 Структура сообщений: заголовки, тело, попапы\n\n1. Заголовок формулируем в расчёте на то, что прочитают только его — сразу суть, без приветствий: «Подпишитесь на уведомления о требованиях», а не «Здравствуйте!».\n2. Заголовки похожих сообщений делаем различимыми по первым словам — это помогает и пользователю, и поддержке.\n3. Тело сообщения раскрывает: что случилось, что делать сейчас, что делать/не делать в будущем — не все три пункта обязательны.\n4. Тосты и хинты — вспомогательный текст-подпись, без точки в конце (если это одно предложение).\n5. Тултип — подпись без точки, если это одна фраза; если текст на несколько абзацев — обычная пунктуация.\n6. Вопросительный знак в заголовке — только если реально задаём вопрос пользователю, а не когда просто рассказываем.\n7. Списки — не смешиваем классический стиль (двоеточие, запятые, точка в конце) и стиль «жирный заголовок + элементы без пунктуации».\n\n## 📝 Поля и подсказки\n\n1. Подпись поля объясняет, **что** вводить; подсказка-плейсхолдер — **как** вводить (способ ввода, формат, по каким реквизитам ищет).\n2. Не используем в подсказке глаголы «введите», «укажите», «заполните» — действие и так понятно из контекста поля.\n3. Подсказка не нужна, если дублирует подпись поля по смыслу.\n4. Полноценную инструкцию не прячем в подсказку — выносим в отдельный текстовый блок или под ссылку.\n\n## ✅ Подтверждение действий и защита данных\n\n1. Модальное подтверждение — простой, но слабый способ защиты: в момент клика пользователь уже уверен в своём действии.\n2. Конкретика в терминах пользователя усиливает эффект: показываем список объектов, которые затронет действие, вместо общего «Вы уверены?».\n3. Для частых или повторяющихся действий подтверждения не нужны — вместо них даём отмену действия на несколько секунд или восстановление данных.\n4. Тире-прочерк используется при отсутствии данных — это не то же самое, что ноль, и не то же самое, что пустое место (см. также «Под запретом»).\n';
