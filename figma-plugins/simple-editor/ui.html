        // Единый токен новее отдельных legacy-ключей, включая явно очищенное значение.
        if (legacySingle !== null) legacyTokens[next.endpoint] = legacySingle;
        const savedTokens =
          next.apiTokens && typeof next.apiTokens === "object" && !Array.isArray(next.apiTokens)
            ? next.apiTokens
            : {};
        next.apiTokens = {};
        for (const key of ["claude", "openai", "custom"]) {
          next.apiTokens[key] =
            typeof savedTokens[key] === "string"
              ? savedTokens[key]
              : typeof legacyTokens[key] === "string"
                ? legacyTokens[key]
                : "";
        }
        if (next.model === "o4-mini") next.model = "gpt-5-mini";
        if (next.model === "claude-haiku-4-5") next.model = "claude-haiku-4-5-20251001";
        if (!ALL_MODELS.includes(next.model)) next.model = DEFAULT_MODELS[next.endpoint];
        delete next.provider;
        delete next.apiKey;
        delete next.apiToken;
        delete next.anthropicApiKey;
        delete next.anthropicBaseUrl;
        delete next.mockMode;
        return next;
      }

      function go(screen) {
        if (state.screen && state.screen !== screen) {
          state.stack.push(state.screen);
        }
        state.screen = screen;
        render();
      }

      function back() {
        stopLoaderPhrases();
        if (state.screen === "settings" || state.screen === "rules") {
          state.stack = ["intro"];
          state.screen = "menu";
          render();
          return;
        }
        if (state.screen === "menu") {
          state.stack = [];
          state.screen = "intro";
          render();
          return;
        }
        state.screen = state.stack.pop() || "intro";
        if (
          state.screen === "analysis-loading" ||
          state.screen === "check-loading" ||
          state.screen === "block-loading"
        ) {
          state.screen = state.stack.pop() || "intro";
        }
        render();
      }

      function replaceScreen(screen) {
        state.screen = screen;
        render();
      }

      let jobRunning = false;
      let pendingSelection = null;

      async function runExclusive(task) {
        if (jobRunning) return;
        jobRunning = true;
        analysisAbort = false;
        currentAbortController = new AbortController();
        try {
          await task();
        } finally {
          jobRunning = false;
          stopLoaderPhrases();
          if (pendingSelection) {
            const payload = pendingSelection;
            pendingSelection = null;
            if (!["menu", "settings", "rules"].includes(state.screen)) {
              state.screen = "intro";
              state.stack = [];
            }
            window.onmessage({
              source: parent,
              data: { pluginMessage: { type: "selection-updated", payload } },
            });
          }
        }
      }

      window.onmessage = (event) => {
        const raw = event && event.data;
        if (!raw || typeof raw !== "object") return;
        const data = raw.pluginMessage || raw;
        if (!data || !data.type) return;

        if (data.type === "selection-updated") {
          const payload = data.payload || {};
          const selectionChanged =
            (payload.nodeId || null) !== state.selectionNodeId ||
            (payload.selectedText || "") !== state.selectionText;
          const frameChanged =
            (payload.frameId || null) !== state.frameId ||
            JSON.stringify(payload.frameTexts || []) !== JSON.stringify(state.frameTexts);
          if (jobRunning && (selectionChanged || frameChanged || pendingSelection)) {
            pendingSelection = payload;
            analysisAbort = true;
            currentAbortController?.abort();
            return;
          }
          if (selectionChanged || frameChanged) {
            state.variants = [];
            state.analysisResult = null;
            state.checkResult = null;
            state.mode = "";
            if (!["intro", "menu", "settings", "rules"].includes(state.screen)) {
              state.screen = "intro";
              state.stack = [];
            }
          }
          state.selectionText = payload.selectedText || "";
          state.selectionNodeId = payload.nodeId || null;
          state.contextTexts = payload.contextTexts || [];
          state.selectionCount = payload.selectionCount || 0;
          state.textCount = payload.textCount || 0;
          state.selectionError = payload.error || "";
          const nextFrameTexts = Array.isArray(payload.frameTexts) ? payload.frameTexts : [];
          state.frameTexts = nextFrameTexts;
          state.frameName = payload.frameName || "";
          state.frameId = payload.frameId || null;
          if (frameChanged) {
            state.frameResult = null;
            state.frameBlocks = [];
            state.blockVariants = {};
            state.blockModes = {};
            state.blockIndex = -1;
            state.activeBlockIndex = -1;
          }
          if (state.screen === "frame-result" && !hasFrameTexts()) {
            state.screen = "intro";
            state.stack = [];
          }
          if (
            !hasUsableText() &&
            (state.screen === "analysis-result" || state.screen === "check-result")
          ) {
            state.screen = "intro";
            state.stack = [];
          }
          render();
        }
        if (data.type === "cache-loaded") {
          if (data.payload && typeof data.payload === "object") resultCache = data.payload;
        }
        if (data.type === "settings-loaded") {
          if (data.payload) {
            state.settings = { ...state.settings, ...migrateSettings(data.payload) };
            ensureValidModel();
          }
          settingsReady = true;
          render();
        }
        if (data.type === "settings-saved") {
          if (explicitSaveCount > 0) {
            explicitSaveCount -= 1;
            toast("Настройки сохранены", "success");
            state.apiTokenUnlocked[state.settings.endpoint] = false;
            render();
          }
        }
        if (data.type === "variant-applied") {
          const { nodeId, text } = data.payload || {};
          if (nodeId === state.selectionNodeId) state.selectionText = text;
          const block = state.frameTexts.find((item) => item.id === nodeId);
          if (block) block.text = text;
          toast("Текст применён в макет", "success");
        }
        if (data.type === "action-error") {
          if (data.payload?.action === "save-settings") explicitSaveCount = 0;
          toast(data.payload?.message || "Ошибка действия", "error");
        }
      };

      let previewSettings = null;

      function readStoredJson(key) {
        try {
          return JSON.parse(storage.getItem(key));
        } catch (_) {
          return null;
        }
      }

      function mockRuntime(type, payload) {
        if (type === "get-selection") {
          window.postMessage(
            {
              type: "selection-updated",
              payload: {
                nodeId: state.selectionNodeId,
                selectedText: state.selectionText || "",
                contextTexts: state.contextTexts || [],
                selectionCount: state.selectionCount || 0,
                textCount: state.textCount || 0,
              },
            },
            "*"
          );
        }
        if (type === "load-settings") {
          storage.removeItem("kta-settings");
          window.postMessage({ type: "settings-loaded", payload: previewSettings }, "*");
        }
        if (type === "save-settings") {
          previewSettings = JSON.parse(JSON.stringify(payload));
          window.postMessage({ type: "settings-saved" }, "*");
        }
        if (type === "load-cache") {
          window.postMessage({ type: "cache-loaded", payload: readStoredJson("kta-cache") }, "*");
        }
        if (type === "save-cache") {
          storage.setItem("kta-cache", JSON.stringify(payload));
        }
        if (type === "apply-variant") {
          window.postMessage(
            { type: "variant-applied", payload: { nodeId: payload.nodeId, text: payload.text } },
            "*"
          );
        }
      }

      function toast(msg, type = "info") {
        const id = ++toastSeq;
        state.toasts.push({ id, message: msg, type });
        render();
        if (type === "error") return;
        toastTimers[id] = setTimeout(() => dismissToast(id), 4000);
      }

      function dismissToast(id) {
        if (toastTimers[id]) {
          clearTimeout(toastTimers[id]);
          delete toastTimers[id];
        }
        state.toasts = state.toasts.filter((t) => t.id !== id);
        render();
      }

      function scoreTone(score) {
        const n = Number(score || 0);
        if (n >= 10) return "perfect";
        if (n >= 8) return "ok";
        if (n >= 5) return "warn";
        return "bad";
      }

      const MAX_SOURCE_URLS = 12;

      function splitSourceLine(line) {
        const raw = String(line || "");
        const tabIdx = raw.indexOf("\t");
        if (tabIdx === -1) return { label: "", url: raw.trim() };
        return { label: raw.slice(0, tabIdx).trim(), url: raw.slice(tabIdx + 1).trim() };
      }

      function customSourceTitle(url) {
        const match = SOURCES.find((item) => item.url === url);
        if (match) return match.title;
        const lines = String(state.settings.sourceUrls || "")
          .split("\n")
          .map(splitSourceLine);
        const found = lines.find((l) => l.url === url);
        return found ? found.label : "";
      }

      function parseUrls(raw) {
        const fromSettings = String(raw || "")
          .split("\n")
          .map((line) => splitSourceLine(line).url)
          .filter(Boolean);
        const urls = fromSettings.length ? fromSettings : SOURCES.map((item) => item.url);
        return urls.slice(0, MAX_SOURCE_URLS);
      }

      function isMarkdownUrl(url) {
        try {
          const path = new URL(url).pathname.toLowerCase();
          return /\.(md|markdown)$/.test(path);
        } catch (_) {
          return /\.(md|markdown)(\?|#|$)/i.test(String(url || ""));
        }
      }

      async function fetchUrlText(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Не удалось загрузить: ${url}`);
        return await res.text();
      }

      function sanitizeText(input) {
        return String(input || "")
          .replace(/<script[\s\S]*?<\/script>/gi, " ")
          .replace(/<style[\s\S]*?<\/style>/gi, " ")
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/<[^>]+>/g, " ")
          .replace(/&nbsp;/gi, " ")
          .replace(/&amp;/gi, "&")
          .replace(/&quot;/gi, '"')
          .replace(/\s+/g, " ")
          .trim();
      }

      function sanitizeMarkdownText(input) {
        return String(input || "")
          .replace(/\r\n/g, "\n")
          .replace(/&nbsp;/gi, " ")
          .replace(/&amp;/gi, "&")
          .replace(/&quot;/gi, '"')
          .replace(/[ \t]+/g, " ")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function firstMarkdownHeading(text) {
        const match = String(text || "").match(/^#{1,6}\s+(.+)$/m);
        return match ? match[1].replace(/^[^\p{L}\p{N}«"]+/u, "").trim() : "";
      }

      function sourceLabel(sourceId, url) {
        if (sourceId === "manual") return "Дополнительный текст БЗ";
        const custom = customSourceTitle(url || sourceId);
        if (custom) return custom;
        if (url) {
          try {
            return new URL(url).hostname.replace(/^www\./, "");
          } catch (_) {}
        }
        return sourceId || "Источник";
      }

      function ruleSectionTitle(sourceId, url) {
        return customSourceTitle(url || sourceId) || sourceLabel(sourceId, url);
      }

      function extractRulePoints(text) {
        const numbered = String(text || "")
          .split("\n")
          .map((line) => line.replace(/^\d+\.\s+/, "").trim())
          .filter((line) => line.length >= 12 && line.length < 400);
        if (numbered.length >= 3) return numbered.slice(0, 16);

        const junkRe = /[{};]|^\d+$|^\W+$/;
        const codeRe =
          /\b(function|const|let|var|return|import|export|window\.|document\.|=>|classList|querySelector)\b/i;
        const urlRe = /https?:\/\/|www\./i;
        return String(text || "")
          .split(/(?<=[.!?])\s+|\n+/)
          .map((item) => item.trim())
          .filter((item) => item.length >= 15 && item.length < 300)
          .filter((item) => !junkRe.test(item) && !codeRe.test(item) && !urlRe.test(item));
      }

      function isMockMode() {
        return settingsReady && !bridge.isFigma;
      }

      function sanitizeApiKey(input) {
        return String(input || "")
          .replace(/[\u200B-\u200D\uFEFF]/g, "")
          .replace(/\s+/g, "")
          .trim();
      }

      // Сохранение и проверка подключения активны только когда заполнены поля,
      // без которых запрос к провайдеру заведомо не пройдёт.
      function currentApiToken() {
        return (state.settings.apiTokens || {})[state.settings.endpoint] || "";
      }

      function setCurrentApiToken(value) {
        if (!state.settings.apiTokens)
          state.settings.apiTokens = { claude: "", openai: "", custom: "" };
        state.settings.apiTokens[state.settings.endpoint] = value;
      }

      // Минимальная проверка ввода в плагине; действительность ключа проверяет API.
      const MIN_API_TOKEN_LENGTH = 20;

      function apiTokenError(value = currentApiToken()) {
        const token = sanitizeApiKey(value);
        if (!token) return "Добавьте API-ключ в Настройках.";
        if (token.length < MIN_API_TOKEN_LENGTH)
          return `Токен слишком короткий — нужно минимум ${MIN_API_TOKEN_LENGTH} символов без пробелов.`;
        return "";
      }

      function settingsFieldsFilled() {
        if (apiTokenError()) return false;
        if (state.settings.endpoint === "custom" && !(state.settings.apiUrl || "").trim())
          return false;
        return true;
      }

      // Токен считаем «зафиксированным», пока он валиден и пользователь явно не нажал
      // «Изменить» — так его нельзя случайно скопировать или подсмотреть целиком.
      function isApiTokenLocked() {
        const token = sanitizeApiKey(currentApiToken());
        return (
          Boolean(token) && !apiTokenError() && !state.apiTokenUnlocked[state.settings.endpoint]
        );
      }

      function maskApiToken(token) {
        const clean = sanitizeApiKey(token);
        return clean.length <= 4 ? clean : `${clean.slice(0, 4)}••••••••`;
      }

      function updateSettingsActionButtons() {
        const filled = settingsFieldsFilled();
        const saveBtn = document.getElementById("saveSettingsBtn");
        if (saveBtn) saveBtn.disabled = !filled;
        const checkBtn = document.getElementById("checkConnectionBtn");
        if (checkBtn) checkBtn.disabled = !filled || state.apiStatus === "checking";
        const input = document.getElementById("apiTokenInput");
        const error = Boolean(sanitizeApiKey(currentApiToken()) && apiTokenError());
        if (input) input.setAttribute("aria-invalid", String(error));
      }

      function getProviderConfig() {
        const endpoint = state.settings.endpoint || "claude";
        const model = state.settings.model || DEFAULT_MODELS[endpoint];
        const kind = endpoint === "claude" ? "claude" : "openai";
        const baseUrl =
          endpoint === "claude"
            ? DEFAULT_ANTHROPIC_BASE_URL
            : endpoint === "openai"
              ? DEFAULT_OPENAI_BASE_URL
              : (state.settings.apiUrl || "").trim().replace(/\/+$/, "");
        if (endpoint === "custom") {
          let url;
          try {
            url = new URL(baseUrl);
          } catch (_) {
            throw new Error("Укажите полный HTTPS-адрес API в Настройках.");
          }
          if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash) {
            throw new Error(
              "Адрес API должен использовать HTTPS, без логина, пароля, параметров и фрагмента."
            );
          }
        }
        return {
          provider: kind,
          key: sanitizeApiKey(currentApiToken()),
          baseUrl,
          defaultModel: model,
          isDefaultAnthropicHost: endpoint === "claude",
        };
      }

      function availableModels(endpoint = state.settings.endpoint) {
        return ALL_MODELS.filter(
          (model) =>
            endpoint === "custom" ||
            (endpoint === "claude" ? model.startsWith("claude-") : !model.startsWith("claude-"))
        );
      }

      function ensureValidModel() {
        const models = availableModels();
        if (!models.includes(state.settings.model))
          state.settings.model = DEFAULT_MODELS[state.settings.endpoint] || models[0];
      }

      function sourceCacheKey(url) {
        return `kta-src:${url}`;
      }

      function readSourceCache(url) {
        try {
          const raw = storage.getItem(sourceCacheKey(url));
          return raw ? JSON.parse(raw) : null;
        } catch (_) {
          return null;
        }
      }

      function writeSourceCache(url, entry) {
        storage.setItem(sourceCacheKey(url), JSON.stringify(entry));
      }

      function bundledEntry(url) {
        const text = BUNDLED_SOURCE_TEXTS && BUNDLED_SOURCE_TEXTS[url];
        if (!text) return null;
        const sanitized = sanitizeMarkdownText(text).slice(0, 20000);
        const title =
          customSourceTitle(url) || firstMarkdownHeading(sanitized) || ruleSectionTitle(url, url);
        return {
          id: url,
          type: "bundled",
          source: url,
          label: title,
          title,
          text: sanitized,
          points: extractRulePoints(sanitized),
          ok: true,
          bundled: true,
          loadedAt: null,
        };
      }

      function makeSourceEntry(url, raw, fromNetwork) {
        const isMd = fromNetwork ? isMarkdownUrl(url) || /^\s*#/m.test(raw) : true;
        const sanitized = (isMd ? sanitizeMarkdownText(raw) : sanitizeText(raw)).slice(0, 20000);
        const customLabel = customSourceTitle(url);
        const title =
          customLabel || (isMd && firstMarkdownHeading(sanitized)) || ruleSectionTitle(url, url);
        return {
          id: url,
          type: isMd ? "markdown" : "url",
          source: url,
          label: customLabel || sourceLabel(url, url),
          title,
          text: sanitized,
          points: extractRulePoints(sanitized),
          ok: true,
          loadedAt: new Date().toISOString(),
        };
      }

      async function loadSource(url, force) {
        if (!force) {
          const cached = readSourceCache(url);
          if (cached && cached.ok) return cached;
          const bundled = bundledEntry(url);
          if (bundled) return bundled;
          return { id: url, source: url, ok: false, error: "не загружено" };
        }
        try {
          const text = await fetchUrlText(url);
          const entry = makeSourceEntry(url, text, true);
          writeSourceCache(url, entry);
          return entry;
        } catch (e) {
          const bundled = bundledEntry(url);
          if (bundled) return bundled;
          return {
            id: url,
            source: url,
            ok: false,
            error: e.message || "Ошибка загрузки",
            loadedAt: new Date().toISOString(),
          };
        }
      }

      function manualRulesEntry() {
        const manualRaw = (state.settings.manualRulesText || "").trim();
        if (!manualRaw) return null;
        return {
          id: "manual",
          type: "manual",
          source: "manual",
          label: sourceLabel("manual"),
          title: firstMarkdownHeading(manualRaw) || "Дополнительные правила",
          text: manualRaw,
          points: extractRulePoints(manualRaw),
        };
      }

      function assembleKnowledgeBase(sourceStatuses) {
        const sourceEntries = sourceStatuses.filter((e) => e.ok);
        const manual = manualRulesEntry();
        if (manual) sourceEntries.push(manual);
        const combinedText = sourceEntries
          .map((entry) => `## ${entry.title}\n\n${entry.text}`)
          .join("\n\n---\n\n");
        state.knowledgeBase = {
          combinedText,
          loadedAt: new Date().toISOString(),
          sources: sourceEntries.map((e) => e.id),
          sourceEntries,
          sourceStatuses,
        };
        return state.knowledgeBase;
      }

      async function loadKnowledgeBase(force = false) {
        const urls = parseUrls(state.settings.sourceUrls);
        const sourceStatuses = [];
        for (const url of urls) sourceStatuses.push(await loadSource(url, force));
        return assembleKnowledgeBase(sourceStatuses);
      }

      const VARIANTS_SCHEMA = {
        type: "object",
        properties: {
          variants: {
            type: "array",
            items: {
              type: "object",
              properties: {
                text: { type: "string" },
                score: { type: "number" },
                reason: { type: "string" },
                tags: { type: "array", items: { type: "string" } },
              },
              required: ["text", "score", "reason", "tags"],
              additionalProperties: false,
            },
          },
        },
        required: ["variants"],
        additionalProperties: false,
      };

      const ISSUE_SCHEMA = {
        type: "object",
        properties: {
          fragment: { type: "string" },
          problem: { type: "string" },
          recommendation: { type: "string" },
          severity: { type: "string" },
        },
        required: ["fragment", "problem", "recommendation", "severity"],
        additionalProperties: false,
      };

      const CHECK_SCHEMA = {
        type: "object",
        properties: {
          score: { type: "number" },
          summary: { type: "string" },
          tags: { type: "array", items: { type: "string" } },
          recommendations: { type: "array", items: { type: "string" } },
          issues: { type: "array", items: ISSUE_SCHEMA },
        },
        required: ["score", "summary", "recommendations", "issues"],
        additionalProperties: false,
      };

      const FRAME_SCHEMA = {
        type: "object",
        properties: {
          score: { type: "number" },
          summary: { type: "string" },
          blocks: {
            type: "array",
            items: {
              type: "object",
              properties: {
                index: { type: "number" },
                score: { type: "number" },
                tags: { type: "array", items: { type: "string" } },
                issues: { type: "array", items: ISSUE_SCHEMA },
              },
              required: ["index", "score", "tags", "issues"],
              additionalProperties: false,
            },
          },
        },
        required: ["score", "summary", "blocks"],
        additionalProperties: false,
      };

      function validateModelOutput(value, schema) {
        const fail = () => {
          throw new Error("Модель вернула некорректный результат. Повторите запрос.");
        };
        const check = (item, rule) => {
          if (rule.type === "object") {
            if (!item || typeof item !== "object" || Array.isArray(item)) fail();
            for (const key of rule.required || []) if (!(key in item)) fail();
            for (const [key, child] of Object.entries(rule.properties || {})) {
              if (key in item) check(item[key], child);
            }
            if ("score" in item && (item.score < 0 || item.score > 10)) fail();
          } else if (rule.type === "array") {
            if (!Array.isArray(item)) fail();
            item.forEach((child) => check(child, rule.items));
          } else if (
            typeof item !== rule.type ||
            (rule.type === "number" && !Number.isFinite(item))
          )
            fail();
        };
        check(value, schema);
        if (schema === FRAME_SCHEMA) {
          const indices = new Set(value.blocks.map((block) => block.index));
          if (
            indices.size !== state.frameTexts.length ||
            value.blocks.length !== indices.size ||
            [...indices].some(
              (index) => !Number.isInteger(index) || index < 0 || index >= state.frameTexts.length
            )
          )
            fail();
        }
      }

      function parseJsonLoose(raw) {
        const text = String(raw || "").trim();
        try {
          return JSON.parse(text);
        } catch (_) {}
        const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
        if (fenced) {
          try {
            return JSON.parse(fenced[1]);
          } catch (_) {}
        }
        const start = text.indexOf("{");
        const end = text.lastIndexOf("}");
        if (start !== -1 && end > start) {
          try {
            return JSON.parse(text.slice(start, end + 1));
          } catch (_) {}
        }
        throw new Error("Модель вернула ответ не в формате JSON.");
      }

      async function readApiError(response, provider) {
        const raw = await response.text();
        let parsed = null;
        try {
          parsed = JSON.parse(raw);
        } catch (_) {}
        const apiMessage = parsed?.error?.message || raw || response.statusText;
        let error;
        if (response.status === 401)
          error = new Error(`401 Unauthorized (${provider}): ${apiMessage}`);
        else if (response.status === 429) {
          error = new Error(
            `429 Лимит или квота (${provider}): ${apiMessage}. Обычно нужен пополненный баланс API.`
          );
        } else {
          error = new Error(`Ошибка API ${provider} (${response.status}): ${apiMessage}`);
        }
        error.status = response.status;
        return error;
      }

      function isRetryableError(error) {
        if (error?.name === "AbortError") return false;
        if (typeof error?.status === "number") return error.status === 429 || error.status >= 500;
        return true;
      }

      const REQUEST_TIMEOUT_MS = 60000;
      const MAX_OUTPUT_TOKENS = 3000;

      function withTimeout(signal, ms) {
        const controller = new AbortController();
        const onAbort = () => controller.abort(signal.reason);
        if (signal.aborted) controller.abort(signal.reason);
        else signal.addEventListener("abort", onAbort, { once: true });
        const timer = setTimeout(
          () =>
            controller.abort(new DOMException("Превышено время ожидания ответа.", "TimeoutError")),
          ms
        );
        return {
          signal: controller.signal,
          dispose() {
            clearTimeout(timer);
            signal.removeEventListener("abort", onAbort);
          },
        };
      }

      async function callClaude(cfg, systemBlocks, user, schema, signal) {
        const supportsAdaptiveThinking = !cfg.defaultModel.startsWith("claude-haiku-");
        const response = await fetch(`${cfg.baseUrl}/messages`, {
          method: "POST",
          signal,
          headers: {
            "Content-Type": "application/json",
            "x-api-key": cfg.key,
            "anthropic-version": "2023-06-01",
            ...(cfg.isDefaultAnthropicHost
              ? { "anthropic-dangerous-direct-browser-access": "true" }
              : {}),
          },
          body: JSON.stringify({
            model: cfg.defaultModel,
            max_tokens: MAX_OUTPUT_TOKENS,
            system: systemBlocks,
            ...(supportsAdaptiveThinking ? { thinking: { type: "adaptive" } } : {}),
            output_config: {
              ...(supportsAdaptiveThinking ? { effort: "low" } : {}),
              format: { type: "json_schema", schema },
            },
            messages: [{ role: "user", content: user }],
          }),
        });
        if (!response.ok) throw await readApiError(response, "claude");
        const data = await response.json();
        if (data.stop_reason === "refusal") {
          throw new Error("Claude отклонил запрос. Попробуйте переформулировать текст.");
        }
        const textBlock = (data.content || []).find((block) => block.type === "text");
        return parseJsonLoose(textBlock?.text || "");
      }

      async function callOpenAI(cfg, systemBlocks, user, signal) {
        const systemText = systemBlocks.map((block) => block.text).join("\n\n");
        const response = await fetch(`${cfg.baseUrl}/chat/completions`, {
          method: "POST",
          signal,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${cfg.key}`,
          },
          body: JSON.stringify({
            model: cfg.defaultModel,
            ...(/^(gpt-[56]|o[134])/.test(cfg.defaultModel) ? {} : { temperature: 0.5 }),
            response_format: { type: "json_object" },
            messages: [
              { role: "system", content: systemText },
              { role: "user", content: user },
            ],
          }),
        });
        if (!response.ok) throw await readApiError(response, "openai");
        const data = await response.json();
        return parseJsonLoose(data.choices?.[0]?.message?.content || "");
      }

      async function callModel(systemBlocks, user, schema) {
        ensureValidModel();
        const cfg = getProviderConfig();
        if (apiTokenError(cfg.key)) throw new Error(apiTokenError(cfg.key));
        state.apiStatus = "checking";
        render();
        const outerSignal = currentAbortController
          ? currentAbortController.signal
          : new AbortController().signal;
        const attempt = async () => {
          outerSignal.throwIfAborted();
          const { signal, dispose } = withTimeout(outerSignal, REQUEST_TIMEOUT_MS);
          try {
            return cfg.provider === "claude"
              ? await callClaude(cfg, systemBlocks, user, schema, signal)
              : await callOpenAI(cfg, systemBlocks, user, signal);
          } finally {
            dispose();
          }
        };
        try {
          let out;
          try {
            out = await attempt();
          } catch (error) {
            if (error?.name === "AbortError" || error?.name === "TimeoutError") throw error;
            if (!isRetryableError(error)) throw error;
            await wait(1000);
            out = await attempt();
          }
          outerSignal.throwIfAborted();
          validateModelOutput(out, schema);
          state.apiStatus = "ok";
          render();
          return out;
        } catch (error) {
          if (outerSignal.aborted) {
            state.apiStatus = "idle";
            render();
            throw error;
          }
          state.apiStatus = "error";
          render();
          if (error?.name === "TimeoutError")
            throw new Error("Превышено время ожидания ответа. Попробуйте ещё раз.");
          throw error;
        }
      }

      async function checkApiKey() {
        state.loading = true;
        state.apiStatus = "checking";
        render();
        try {
          if (apiTokenError()) throw new Error(apiTokenError());
          if (isMockMode()) {
            state.apiStatus = "idle";
            toast("Локальный предпросмотр вне Figma: проверка ключа не требуется", "success");
            return;
          }
          ensureValidModel();
          const cfg = getProviderConfig();
          if (!cfg.key) throw new Error("Добавьте API-ключ в Настройках.");
          const headers =
            cfg.provider === "claude"
              ? {
                  "x-api-key": cfg.key,
                  "anthropic-version": "2023-06-01",
                  ...(cfg.isDefaultAnthropicHost
                    ? { "anthropic-dangerous-direct-browser-access": "true" }
                    : {}),
                }
              : { Authorization: `Bearer ${cfg.key}` };
          const timeout = withTimeout(new AbortController().signal, REQUEST_TIMEOUT_MS);
          let response;
          try {
            response = await fetch(`${cfg.baseUrl}/models`, {
              method: "GET",
              headers,
              signal: timeout.signal,
            });
          } finally {
            timeout.dispose();
          }
          if (!response.ok) {
            state.apiStatus = "error";
            render();
            throw await readApiError(response, cfg.provider);
          }
          state.apiStatus = "ok";
          toast(`Ключ работает, ${cfg.provider} API доступен`, "success");
        } catch (e) {
          state.apiStatus = "error";
          toast(e.message || "Не удалось проверить ключ", "error");
        } finally {
          state.loading = false;
          render();
        }
      }

      function generationTaskName(mode) {
        if (mode === "shorten") return "Сократить";
        if (mode === "clarify") return "Сделать четче";
        if (mode === "friendly") return "Сделать дружелюбнее";
        return "Переформулировать";
      }

      function normalizeSpaces(text) {
        return String(text || "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function mockTransformText(input, mode) {
        let t = normalizeSpaces(input);
        if (!t) return t;
        if (mode === "shorten") {
          t = t
            .replace(/необходимо/gi, "нужно")
            .replace(/осуществить/gi, "сделать")
            .replace(/в случае если/gi, "если");
        } else if (mode === "clarify") {
          t = t.replace(/\(ЮЛ, ИП, ФЛ\)/g, "для юрлиц, ИП и физлиц").replace(/1000/g, "1 000");
        } else if (mode === "friendly") {
          t = t.replace(/наблюдения/gi, "отслеживания").replace(/Расширяет/g, "Поможет расширить");
        } else {
          t = t
            .replace(/\(ЮЛ, ИП, ФЛ\)/g, "(юридические лица, ИП, физические лица)")
            .replace(/1000/g, "1000")
            .replace(
              /Расширяет лимит наблюдения каждого пользователя/g,
              "Увеличивает лимит объектов наблюдения для каждого пользователя"
            );
        }
        return normalizeSpaces(t);
      }

      function estimateScore(text) {
        const lower = (text || "").toLowerCase();
        let score = 7;
        if (lower.includes("необходимо") || lower.includes("осуществить")) score -= 2;
        if (/\([^)]+\)/.test(text || "")) score -= 1;
        if (lower.length > 170) score -= 1;
        if (lower.includes("проверьте") || lower.includes("укажите")) score += 1;
        return Math.max(0, Math.min(10, score));
      }

      // Тот же признак парцелляции, что и в mockTags, но возвращает саму вторую
      // фразу — иначе фрагмент-заглушка не находится в тексте и не подсвечивается.
      function secondSentenceFragment(text) {
        const match = /\.\s+([А-ЯA-Z][^.!?]*[.!?]?)/.exec(String(text || ""));
        return match ? match[1].trim() : "";
      }

      function mockTags(text) {
        const tags = [];
        if (/\([^)]+\)/.test(text || "")) tags.push("Скобки");
        if (/\.\s+[А-ЯA-Z]/.test(text || "")) tags.push("Парцелляция");
        if (/\d{4,}/.test(text || "") && !/\d{1,3}(?:\s\d{3})+/.test(text || ""))
          tags.push("Разряды чисел");
        return tags;
      }

      function generateMockVariants(base = state.selectionText, mode = state.mode) {
        const count = Math.max(1, Math.min(5, Number(state.settings.variantsCount || 3)));
        const variants = [];
        for (let i = 0; i < count; i += 1) {
          const text = mockTransformText(base, mode);
          variants.push({
            text,
            score: estimateScore(text),
            reason: "Сухой и точный, где важна ясность формулировки, а не продающий тон",
            tags: buildMockTags(mode),
          });
        }
        return variants;
      }

      function buildMockTags(mode) {
        if (mode === "shorten") return ["короче", "по делу"];
        if (mode === "clarify") return ["четкость", "конкретика"];
        if (mode === "friendly") return ["дружелюбно", "без канцелярита"];
        return ["переформулировка", "понятность"];
      }

      function runMockCheck(source) {
        const text = normalizeSpaces(source === undefined ? state.selectionText : source);
        const tags = mockTags(text);
        const issues = [];
        if (tags.includes("Скобки")) {
          issues.push({
            fragment: "(ЮЛ, ИП, ФЛ)",
            problem: "Скобки",
            recommendation: "Уберите скобки",
            severity: "medium",
          });
        }
        if (tags.includes("Парцелляция")) {
          issues.push({
            fragment: secondSentenceFragment(text) || "второе предложение",
            problem: "Парцелляция",
            recommendation: "Свяжите предложения или переформулируйте целиком",
            severity: "medium",
          });
        }
        if (tags.includes("Разряды чисел")) {
          issues.push({
            fragment: "1000",
            problem: "Разряды чисел",
            recommendation: "Разделите число по разрядам",
            severity: "low",
          });
        }
        if (!text) {
          issues.push({
            fragment: "-",
            problem: "Пустой текст",
            recommendation: "Добавьте текст для проверки",
            severity: "high",
          });
        }
        return {
          score: estimateScore(text),
          summary: issues.length
            ? "Есть замечания, текст можно улучшить."
            : "Текст в целом соответствует правилам.",
          tags,
          issues,
          recommendations:
            issues.length === 0
              ? ["Оставьте формулировку как есть или проверьте её в контексте соседних элементов."]
              : issues.map((issue) => issue.recommendation).filter(Boolean),
        };
      }

      async function generateVariants(append) {
        state.loading = true;
        state.loadingMore = Boolean(append);
        render();
        try {
          let next = [];
          const key = variantsCacheKey(state.mode);
          const cached = !append && touchCache(key);
          if (isMockMode()) {
            next = generateMockVariants();
            if (!next.length) throw new Error("Не удалось собрать мок-варианты.");
          } else if (cached && Array.isArray(cached.data) && cached.data.length) {
            next = cached.data;
          } else {
            await ensureRulesReady();
            const task = generationTaskName(state.mode);
            const user = [
              `Задача: ${task}.`,
              `Текст: ${clipText(state.selectionText, 2000)}`,
              `Соседние тексты на экране: ${neighbourContext()}`,
              `Нужно сгенерировать ${state.settings.variantsCount} вариантов.`,
              "Верни JSON формата {variants:[{text,score,reason,tags:[]}]}.",
              "score от 0 до 10 по соответствию редполитике.",
              "reason — короткое пояснение тона варианта.",
            ].join("\n");
            const out = await callModel(buildSystemBlocks(), user, VARIANTS_SCHEMA);
            next = Array.isArray(out.variants) ? out.variants : [];
            if (!next.length) throw new Error("Модель вернула пустой ответ.");
            if (!append) {
              resultCache[key] = { data: next, ts: Date.now() };
              persistCache();
            }
          }
          state.variants = append ? state.variants.concat(next) : next;
        } catch (e) {
          if (!analysisAbort) toast(e.message || "Не удалось сгенерировать варианты.", "error");
        } finally {
          state.loading = false;
          state.loadingMore = false;
          render();
        }
      }

      async function runCheck(scope) {
        state.loading = true;
        render();
        try {
          if (isMockMode()) {
            state.checkResult = { ...runMockCheck(), text: state.selectionText };
            return;
          }
          const key = checkCacheKey(scope);
          const cached = touchCache(key);
          if (cached && cached.data) {
            state.checkResult = cached.data;
            return;
          }
          await ensureRulesReady();
          const task =
            scope === "editor"
              ? `Проверь выбранный фрагмент по скиллу only-editor: ${clipText(state.selectionText, 2000)}`
              : `Проверь текст на соответствие редполитике: ${clipText(state.selectionText, 2000)}`;
          const user = [
            task,
            `Соседние тексты на экране: ${neighbourContext()}`,
            "Верни JSON формата:",
            "{score:number,summary:string,tags:string[],recommendations:string[],issues:[{fragment,problem,recommendation,severity}]}",
            "tags: короткие ярлыки замечаний (Скобки, Парцелляция, Капс и т.п.).",
            "recommendations: 2-5 конкретных советов, как исправить текст.",
            "score от 0 до 10 — это оценка модели по редполитике.",
          ].join("\n");
          state.checkResult = {
            ...(await callModel(buildSystemBlocks(scope, "check"), user, CHECK_SCHEMA)),
            text: state.selectionText,
          };
          resultCache[key] = { data: state.checkResult, ts: Date.now() };
          persistCache();
        } catch (e) {
          if (!analysisAbort) toast(e.message || "Ошибка проверки.", "error");
          throw e;
        } finally {
          state.loading = false;
          render();
        }
      }

      async function runAnalysis() {
        await runCheck("full");
        const result = state.checkResult || {};
        const issues = Array.isArray(result.issues)
          ? result.issues.filter((item) => item?.problem)
          : [];
        const tags =
          Array.isArray(result.tags) && result.tags.length
            ? result.tags
            : issues.map((item) => item.problem).filter(Boolean);
        state.analysisResult = {
          score: Number(result.score || 0),
          tags,
          issues,
          summary: result.summary || "",
          text: state.selectionText,
        };
      }

      function mockFrameResult() {
        const blocks = state.frameTexts.map((item, idx) => {
          const check = runMockCheck(item.text);
          return { index: idx, score: check.score, tags: check.tags, issues: check.issues };
        });
        const scores = blocks.map((b) => Number(b.score || 0));
        const avg = scores.length
          ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length)
          : 0;
        return { score: avg, summary: "Мок-разбор экрана.", blocks };
      }

      async function runFrameAnalysis(scope) {
        if (isMockMode()) {
          state.frameResult = mockFrameResult();
          state.frameBlocks = state.frameResult.blocks;
          return;
        }
        const key = frameCacheKey(scope);
        const cached = touchCache(key);
        if (cached && cached.data) {
          state.frameResult = cached.data;
          state.frameBlocks = cached.data.blocks || [];
          return;
        }
        await ensureRulesReady();
        const user = [
          `Перед тобой все тексты одного экрана «${state.frameName || "Экран"}» в порядке чтения.`,
          scope === "editor"
            ? "Проверь каждый фрагмент по скиллу only-editor, учитывая контекст экрана."
            : "Разбирай их как единое целое: учитывай общий тон, повторы, согласованность заголовков и кнопок.",
          "",
          frameTextsBlock(),
          "",
          `Верни JSON: {score:number, summary:string, blocks:[{index:number,score:number,tags:string[],issues:[{fragment,problem,recommendation,severity}]}]}`,
          "index — номер текста из списка выше минус 1 (нумерация с нуля). Верни блок для каждого текста.",
          "score блока — от 0 до 10 по редполитике. score сверху — общая оценка экрана.",
          scope === "editor"
            ? "summary — 1-2 предложения об общих замечаниях к фрагментам экрана."
            : "summary — 1-2 предложения о тексте экрана в целом: тон, повторы, согласованность.",
          "tags — короткие ярлыки замечаний (Скобки, Парцелляция, Капс и т.п.), пустой массив если замечаний нет.",
          "fragment — точная подстрока из этого текста.",
        ].join("\n");
        const out = await callModel(buildSystemBlocks(scope, "check"), user, FRAME_SCHEMA);
        const blocks = Array.isArray(out.blocks) ? out.blocks : [];
        if (!blocks.length) throw new Error("Модель вернула пустой разбор экрана.");
        state.frameResult = { score: Number(out.score || 0), summary: out.summary || "", blocks };
        state.frameBlocks = blocks;
        resultCache[key] = { data: state.frameResult, ts: Date.now() };
        persistCache();
      }

      async function startFrameAnalysis(scope) {
        if (!hasFrameTexts()) {
          toast("Выберите фрейм с текстом.", "error");
          return;
        }
        state.frameResult = null;
        state.frameBlocks = [];
        state.blockVariants = {};
        state.blockModes = {};
        state.blockIndex = -1;
        state.activeBlockIndex = -1;
        state.variants = [];
        state.mode = "";
        state.loaderPhrase = LOADER_PHRASES[0];
        analysisAbort = false;
        currentAbortController = new AbortController();
        go("analysis-loading");
        try {
          state.frameScope = scope;
          await runJobWithLoader(() => runFrameAnalysis(scope));
          if (analysisAbort) return;
          stopLoaderPhrases();
          if (state.frameResult) replaceScreen("frame-result");
          else {
            back();
            toast("Не удалось проанализировать экран.", "error");
          }
        } catch (e) {
          if (analysisAbort) return;
          stopLoaderPhrases();
          back();
          toast(e.message || "Не удалось проанализировать экран.", "error");
        }
      }

      function blockResult(idx) {
        const blocks = state.frameBlocks || [];
        return blocks.find((item) => Number(item.index) === idx) || null;
      }

      async function generateBlockVariants(idx, mode, append) {
        const block = state.frameTexts[idx];
        if (!block) return;
        state.blockModes[idx] = mode;
        state.loadingBlock = idx;
        state.loadingBlockMore = Boolean(append);
        render();

        try {
          let next = [];
          const key = variantsCacheKey(mode, block.text, frameContext(idx));
          const cached = !append && touchCache(key);
          if (isMockMode()) {
            await wait(LOADER_PHRASE_MS);
            if (analysisAbort) return;
            next = generateMockVariants(block.text, mode);
            if (!next.length) throw new Error("Не удалось собрать мок-варианты.");
          } else if (cached && Array.isArray(cached.data) && cached.data.length) {
            next = cached.data;
          } else {
            await ensureRulesReady();
            const task = generationTaskName(mode);
            const user = [
              `Задача: ${task}.`,
              `Текст: ${clipText(block.text, 2000)}`,
              `Остальные тексты этого экрана (контекст):\n${frameContext(idx)}`,
              `Нужно сгенерировать ${state.settings.variantsCount} вариантов.`,
              "Верни JSON формата {variants:[{text,score,reason,tags:[]}]}.",
              "score от 0 до 10 по соответствию редполитике.",
              "reason — короткое пояснение тона варианта.",
            ].join("\n");
            const out = await callModel(buildSystemBlocks(), user, VARIANTS_SCHEMA);
            next = Array.isArray(out.variants) ? out.variants : [];
            if (!next.length) throw new Error("Модель вернула пустой ответ.");
            if (!append) {
              resultCache[key] = { data: next, ts: Date.now() };
              persistCache();
            }
          }
          const current = state.blockVariants[idx] || [];
          state.blockVariants[idx] = append ? current.concat(next) : next;
        } catch (e) {
          if (!analysisAbort) toast(e.message || "Не удалось сгенерировать варианты.", "error");
        } finally {
          state.loadingBlock = -1;
          state.loadingBlockMore = false;
          render();
        }
      }

      async function startBlockMode(idx, mode) {
        state.activeBlockIndex = idx;
        state.loaderPhrase = LOADER_PHRASES[0];
        analysisAbort = false;
        currentAbortController = new AbortController();
        go("block-loading");
        try {
          await runJobWithLoader(() => generateBlockVariants(idx, mode, false));
          if (analysisAbort) return;
          stopLoaderPhrases();
          if ((state.blockVariants[idx] || []).length) replaceScreen("block-detail");
          else back();
        } catch (e) {
          if (analysisAbort) return;
          stopLoaderPhrases();
          back();
          toast(e.message || "Не удалось сгенерировать варианты.", "error");
        }
      }

      async function ensureRulesReady() {
        if (state.knowledgeBase.combinedText) return;
        if (BUNDLED_RULES) {
          state.knowledgeBase.combinedText = BUNDLED_RULES;
          state.knowledgeBase.loadedAt = new Date().toISOString();
          return;
        }
        await loadKnowledgeBase(false);
      }

      function saveSettings() {
        // Пустое значение позволяет удалить сохранённый ключ, короткий черновик не сохраняем.
        if (sanitizeApiKey(currentApiToken()) && apiTokenError()) return;
        bridge.send("save-settings", state.settings);
      }

      function saveSettingsExplicit() {
        if (!settingsFieldsFilled()) {
          updateSettingsActionButtons();
          return;
        }
        explicitSaveCount += 1;
        saveSettings();
      }

      function escapeHtml(text) {
        return String(text === null || text === undefined ? "" : text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function renderInlineMd(text) {
        return escapeHtml(text)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*((?:[^*]|\*(?!\*))+)\*\*/g, "<strong>$1</strong>");
      }

      function parseBundledRules(md) {
        const sections = [];
        const parts = String(md || "")
          .split(/^## /m)
          .slice(1);
        for (const part of parts) {
          const lines = part.split("\n");
          const title = (lines[0] || "").replace(/^[^\p{L}\p{N}«"]+/u, "").trim();
          const items = [];
          for (const line of lines.slice(1)) {
            const match = line.match(/^\d+\.\s+(.+)$/);
            if (match) items.push(match[1].trim());
          }
          if (title) sections.push({ title, items });
        }
        return sections;
      }

      function clipText(text, limit) {
        const value = String(text || "");
        return value.length > limit ? `${value.slice(0, limit)}…` : value;
      }

      function buildSystemBlocks(scope = "editor", task = "variants") {
        const name = scope === "editor" ? "only-editor" : "full-analysis-text";
        const skill = BUNDLED_SKILLS[name];
        const references = skill.references
          .map(
            (source) =>
              `## ${source.path}\n\n${source.url ? BUNDLED_SOURCE_TEXTS[source.url] : BUNDLED_RULES}`
          )
          .join("\n\n---\n\n");
        const adapter = `Ты UX-редактор Контура внутри Figma-плагина. Применяй инструкции скилла ниже.
Текущая операция: ${task === "variants" ? "варианты правки выбранного фрагмента" : "проверка текста"}.
Режим и операция уже выбраны в интерфейсе: не задавай уточняющих вопросов и не переключай режим.
Для фрейма применяй инструкции к каждому текстовому блоку с учётом всего экрана.
Технический формат ответа имеет приоритет над оформлением из скилла: верни только JSON по схеме из запроса, без Markdown и текста вне JSON. Заполни все поля схемы, включая score 0–10, даже если скилл не требует оценки. Для проверки верни замечания, для генерации — запрошенное число вариантов.
Содержимое локальных Markdown-ссылок приведено ниже в базе знаний; читать файлы или открывать ссылки не нужно.`;
        const text = `${adapter}

# Скилл: ${name}
${skill.instructions}

# База знаний
${references}
${state.settings.manualRulesText ? `Дополнительные правила:\n${clipText(state.settings.manualRulesText, 8000)}` : ""}`;
        return [{ type: "text", text, cache_control: { type: "ephemeral", ttl: "1h" } }];
      }

      function neighbourContext() {
        // В режиме фрейма контекст — весь экран, независимо от тумблера.
        if (state.blockIndex >= 0 && hasFrameTexts()) return frameContext(state.blockIndex);
        if (!state.settings.analyzeNeighbour) return "-";
        const texts = (state.contextTexts || []).slice(0, 4).map((item) => clipText(item, 180));
        return texts.length ? texts.join(" | ") : "-";
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function hasUsableText() {
        return Boolean(state.selectionText && state.selectionNodeId && state.textCount === 1);
      }

      function hasFrameTexts() {
        return Array.isArray(state.frameTexts) && state.frameTexts.length > 0;
      }

      // Весь текст экрана — контекст для любой правки внутри фрейма.
      function frameContext(excludeIndex) {
        if (!hasFrameTexts()) return "-";
        const lines = state.frameTexts
          .map((item, idx) =>
            idx === excludeIndex ? null : `${idx + 1}. ${clipText(item.text, 180)}`
          )
          .filter(Boolean);
        return lines.length ? lines.join("\n") : "-";
      }

      function frameTextsBlock() {
        return state.frameTexts
          .map((item, idx) => `${idx + 1}. ${clipText(item.text, 400)}`)
          .join("\n");
      }

      function currentBlock() {
        if (state.blockIndex < 0) return null;
        return state.frameTexts[state.blockIndex] || null;
      }

      function selectionPrompt() {
        if (state.textCount === 1 && state.selectionCount === 1) {
          return `Вижу <span class="accent">1 текстовый слой</span>. Что с ним сделать?`;
        }
        if (state.textCount > 1) {
          return `Вижу <span class="accent">${textLayerCount(state.textCount)}</span>. Выберите один.`;
        }
        if (state.selectionCount > 0) {
          return "Вижу слой, но это не текст. Выберите текстовый слой.";
        }
        return "Ничего не выбрано. Выберите текстовый слой.";
      }

      function stopLoaderPhrases() {
        if (loaderTimer) {
          clearInterval(loaderTimer);
          loaderTimer = null;
        }
      }

      function startLoaderPhrases() {
        stopLoaderPhrases();
        let index = 0;
        state.loaderPhrase = LOADER_PHRASES[0];
        const el = document.getElementById("loaderPhrase");
        if (el) el.textContent = state.loaderPhrase;
        loaderTimer = setInterval(() => {
          index += 1;
          if (isMockMode() && index >= LOADER_MOCK_PHRASES) {
            stopLoaderPhrases();
            return;
          }
          // Фразы идут по кругу, а не замирают на последней.
          state.loaderPhrase = LOADER_PHRASES[index % LOADER_PHRASES.length];
          const phrase = document.getElementById("loaderPhrase");
          if (phrase) phrase.textContent = state.loaderPhrase;
          else render();
        }, LOADER_PHRASE_MS);
      }

      async function runJobWithLoader(task) {
        startLoaderPhrases();
        if (isMockMode()) {
          await wait(LOADER_MOCK_MIN_MS);
          if (analysisAbort) return;
          await task();
          return;
        }
        await task();

        if (!hasUsableText()) {

          return;

        state.variants = [];

        state.analysisResult = null;
        state.loaderPhrase = LOADER_PHRASES[0];
        analysisAbort = false;
        currentAbortController = new AbortController();
        go("analysis-loading");
        try {
          await runJobWithLoader(runAnalysis);
          if (analysisAbort) return;
          stopLoaderPhrases();
          if (state.analysisResult) replaceScreen("analysis-result");
          else {

        } catch (e) {
          if (analysisAbort) return;
          stopLoaderPhrases();
          back();
          toast(e.message || "Не удалось проанализировать текст.", "error");
        }
      }

          if (state.checkResult) replaceScreen("check-result");
          else {

            toast("Не удалось проверить текст.", "error");

        } catch (e) {
          if (analysisAbort) return;
          stopLoaderPhrases();
          back();
          toast(e.message || "Не удалось проверить текст.", "error");
        }
      }

      function ruleIcon(title, idx) {
        return ICONS["rule" + (idx + 1)] || ICONS.box;
      }

      function navHtml() {
        if (state.screen === "intro") {
          return `<div class="nav-row"><button class="icon-btn" id="openMenuBtn" aria-label="Меню">${ICONS.menu}</button></div>`;
        }
        if (state.screen === "menu") {
          return `<div class="nav-row"><button class="icon-btn" id="backBtn" aria-label="Закрыть меню">${ICONS.closeDark}</button></div>`;
        }
        if (state.screen === "settings" || state.screen === "rules") {
          return `<div class="nav-row"><button class="icon-btn" id="backBtn" aria-label="Назад">${ICONS.back}</button></div>`;
        }
        if (
          state.screen === "analysis-loading" ||
          state.screen === "check-loading" ||
          state.screen === "block-loading"
        )
          return "";
        return `<div class="nav-row nav-deep"><button class="icon-btn" id="backBtn" aria-label="Назад">${ICONS.back}</button></div>`;
      }

      function toastHtml() {
        if (!state.toasts.length) return "";
        return `
        <div class="toast-stack">
          ${state.toasts
            .map(
              (t) => `
            <div class="toast ${t.type === "error" ? "error" : t.type === "success" ? "success" : ""}" role="status">
              <span>${escapeHtml(t.message)}</span>
              <button class="toast-close" data-toast-id="${t.id}" aria-label="Закрыть">×</button>
            </div>
          `
            )
            .join("")}
        </div>
      `;
      }

      function textLayerCount(count) {
        const last = count % 10,
          lastTwo = count % 100;
        const word =
          lastTwo >= 11 && lastTwo <= 14
            ? "текстовых слоёв"
            : last === 1
              ? "текстовый слой"
              : last >= 2 && last <= 4
                ? "текстовых слоя"
                : "текстовых слоёв";
        return `${count} ${word}`;
      }

      function frameIntroView() {
        const count = state.frameTexts.length;
        return `
        <div class="screen">
          <div class="intro-title"><span class="logo">Просто</span>&thinsp;<span class="redaktor">редактор</span></div>
          <p class="prompt-text">Вижу <span class="accent">${textLayerCount(count)}</span> во фрейме «${escapeHtml(state.frameName || "Экран")}». Разобрать экран целиком?</p>
          <div class="action-cards">
            <button class="action-card" id="frameAnalysisBtn">
              <div class="action-card-icon">${ICONS.sparkles}</div>
              <div class="action-card-text">
                <span class="action-card-title">Полный анализ</span>
                <span class="action-card-desc">Стандарты Контура, редактор</span>
              </div>
            </button>
            <button class="action-card" id="frameEditorBtn">
              <div class="action-card-icon">${ICONS.typeT}</div>
              <div class="action-card-text">
                <span class="action-card-title">Редактор</span>
                <span class="action-card-desc">Редактирует знаки, пробелы и форматы</span>
              </div>
            </button>
          </div>
        </div>
      `;
      }

      function introView() {
        if (!hasUsableText() && hasFrameTexts() && !state.selectionNodeId) {
          return frameIntroView();
        }
        if (!hasUsableText()) {
          return `
          <div class="screen intro-empty">
            <div>
              <div class="intro-empty-icon">${ICONS.selectLayer}</div>
              <div class="intro-empty-msg">Выберите текстовый слой</div>
              <div class="intro-empty-slot">
                ${
                  isMockMode()
                    ? `<button class="intro-empty-action" id="mockSelectBtn" type="button">Имитация выбора для теста</button>
               <button class="intro-empty-action" id="mockFrameBtn" type="button">Имитация фрейма (${MOCK_FRAME.texts.length} текста)</button>`
                    : ""
                }
              </div>
            </div>
          </div>
        `;
        }
        return `
        <div class="screen">
          <div class="intro-title"><span class="logo">Просто</span>&thinsp;<span class="redaktor">редактор</span></div>
          <p class="prompt-text">${selectionPrompt()}</p>
          <div class="action-cards">
            <button class="action-card" id="fullAnalysisBtn">
              <div class="action-card-icon">${ICONS.sparkles}</div>
              <div class="action-card-text">
                <span class="action-card-title">Полный анализ</span>
                <span class="action-card-desc">Стандарты Контура, редактор</span>
              </div>
            </button>
            <button class="action-card" id="editorBtn">
              <div class="action-card-icon">${ICONS.typeT}</div>
              <div class="action-card-text">
                <span class="action-card-title">Редактор</span>
                <span class="action-card-desc">Редактирует знаки, пробелы и форматы</span>

      function highlightFragments(text, issues) {
        const raw = String(text || "");
        const marks = [];
        (issues || []).forEach((issue, idx) => {
          const fragment = String(issue?.fragment || "").trim();
          if (!fragment) return;
          const start = raw.indexOf(fragment);
          if (start === -1) return;
          const end = start + fragment.length;
          if (marks.some((m) => start < m.end && end > m.start)) return;
          marks.push({ start, end, idx });
        });
        if (!marks.length) return escapeHtml(raw);
        marks.sort((a, b) => a.start - b.start);
        let html = "";
        let cursor = 0;
        marks.forEach((m) => {
          html += escapeHtml(raw.slice(cursor, m.start));
          html += `<span class="result-fragment" data-fragment-idx="${m.idx}">${escapeHtml(raw.slice(m.start, m.end))}</span>`;
          cursor = m.end;
        });
        html += escapeHtml(raw.slice(cursor));
        return html;
      }

            ? ""
            : hasFragments
              ? `<ul class="result-tags">${issues

                  )
                  .join("")}</ul>`
              : tone === "perfect" || !(tags || []).length
                ? `<div class="result-tags"><span class="result-tag">Замечаний нет</span></div>`
                : `<ul class="result-tags">${(tags || [])
                    .map((tag) => `<li class="result-tag">${escapeHtml(tag)}</li>`)
                    .join("")}</ul>`;
        const textHtml = hasFragments ? highlightFragments(text, issues) : escapeHtml(text);
        return `
        <div class="result-card tone-${tone}">
          <div class="result-text">${textHtml}</div>
          ${tagItems}
        </div>
      `;
      }

      function morphAttributes(oldEl, newEl) {
        const newAttrs = newEl.attributes;
        for (let i = 0; i < newAttrs.length; i += 1) {
          const attr = newAttrs[i];
          if (oldEl.getAttribute(attr.name) !== attr.value)
            oldEl.setAttribute(attr.name, attr.value);
        }
        const oldAttrs = oldEl.attributes;
        for (let i = oldAttrs.length - 1; i >= 0; i -= 1) {
          const attr = oldAttrs[i];
          if (!newEl.hasAttribute(attr.name)) oldEl.removeAttribute(attr.name);
        }
      }

      function morphNode(oldNode, newNode) {
        if (oldNode.nodeType === Node.TEXT_NODE) {
          if (oldNode.textContent !== newNode.textContent)
            oldNode.textContent = newNode.textContent;
          return;
        }
        if (oldNode.nodeType !== Node.ELEMENT_NODE) return;
        morphAttributes(oldNode, newNode);
        const tag = oldNode.tagName;
        const focused = document.activeElement === oldNode;
        if (tag === "TEXTAREA") {
          if (!focused && oldNode.value !== newNode.value) oldNode.value = newNode.value;
          return;
        }
        if (tag === "INPUT") {
          if (oldNode.type === "checkbox" || oldNode.type === "radio") {
            if (oldNode.checked !== newNode.checked) oldNode.checked = newNode.checked;
          } else if (!focused && oldNode.value !== newNode.value) {
            oldNode.value = newNode.value;
          }
          return;
        }
        morphChildren(oldNode, newNode);
        if (tag === "SELECT" && !focused && oldNode.value !== newNode.value)
          oldNode.value = newNode.value;
      }

      function sameKind(a, b) {
        if (a.nodeType !== b.nodeType) return false;
        if (a.nodeType === Node.TEXT_NODE) return true;
        if (a.nodeType !== Node.ELEMENT_NODE) return true;
        return a.tagName === b.tagName;
      }

      function morphChildren(oldParent, newParent) {
        const oldChildren = Array.from(oldParent.childNodes);
        const newChildren = Array.from(newParent.childNodes);
        let oldIndex = 0;
        let newIndex = 0;
        while (newIndex < newChildren.length) {
          const newChild = newChildren[newIndex];
          const oldChild = oldChildren[oldIndex];
          if (!oldChild) {
            oldParent.appendChild(newChild.cloneNode(true));
            newIndex += 1;
            continue;
          }
          if (sameKind(oldChild, newChild)) {
            morphNode(oldChild, newChild);
            oldIndex += 1;
            newIndex += 1;
            continue;
          }
          let matchIndex = -1;
          for (let i = oldIndex + 1; i < oldChildren.length; i += 1) {
            if (sameKind(oldChildren[i], newChild)) {
              matchIndex = i;
              break;
            }
          }
          if (matchIndex === -1) {
            oldParent.insertBefore(newChild.cloneNode(true), oldChild);
            newIndex += 1;
            continue;
          }
          for (let i = oldIndex; i < matchIndex; i += 1) oldParent.removeChild(oldChildren[i]);
          morphNode(oldChildren[matchIndex], newChild);
          oldIndex = matchIndex + 1;
          newIndex += 1;
        }
        for (let i = oldIndex; i < oldChildren.length; i += 1) {
          if (oldChildren[i].parentNode === oldParent) oldParent.removeChild(oldChildren[i]);
        }
      }

      function morph(root, html) {
        const temp = document.createElement("div");
        temp.innerHTML = html;
        morphChildren(root, temp);
      }

      function render() {
        const app = document.getElementById("app");
        morph(app, `${navHtml()}${screenView()}${toastHtml()}`);
        bindEvents();
      }

      function bindEvents() {
        const openMenuBtn = document.getElementById("openMenuBtn");
        if (openMenuBtn) openMenuBtn.onclick = () => go("menu");

        const backBtn = document.getElementById("backBtn");
        if (backBtn) backBtn.onclick = back;

        const mockSelectBtn = document.getElementById("mockSelectBtn");
        if (mockSelectBtn) {
          mockSelectBtn.onclick = () => {
            state.selectionText = INFO_SAMPLE;
            state.selectionNodeId = "mock-node";
            state.selectionCount = 1;
            state.textCount = 1;
            render();
          };
        }

        const fullAnalysisBtn = document.getElementById("fullAnalysisBtn");
        if (fullAnalysisBtn) fullAnalysisBtn.onclick = () => runExclusive(startAnalysis);

        const editorBtn = document.getElementById("editorBtn");
        if (editorBtn) editorBtn.onclick = () => runExclusive(startCheck);

        const mockFrameBtn = document.getElementById("mockFrameBtn");
        if (mockFrameBtn) {
          mockFrameBtn.onclick = () => {
            state.frameTexts = MOCK_FRAME.texts.map((item) => ({ ...item }));
            state.frameName = MOCK_FRAME.name;
            state.frameId = "mock-frame";
            state.frameResult = null;
            state.frameBlocks = [];
            state.blockVariants = {};
            state.blockModes = {};
            state.blockIndex = -1;
            state.activeBlockIndex = -1;
            state.selectionText = "";
            state.selectionNodeId = null;
            state.selectionCount = 1;
            state.textCount = 0;
            render();
          };
        }

        const frameAnalysisBtn = document.getElementById("frameAnalysisBtn");
        if (frameAnalysisBtn)
          frameAnalysisBtn.onclick = () => runExclusive(() => startFrameAnalysis("full"));

        const frameEditorBtn = document.getElementById("frameEditorBtn");
        if (frameEditorBtn)
          frameEditorBtn.onclick = () => runExclusive(() => startFrameAnalysis("editor"));

        document.querySelectorAll("[data-select-idx]").forEach((el) => {
          el.onclick = () => {
            const idx = Number(el.dataset.selectIdx);
            const item = state.frameTexts[idx];
            if (item && item.id) bridge.send("select-node", { nodeId: item.id });
          };
        });

        document.querySelectorAll("[data-block-mode]").forEach((el) => {
          el.onclick = () => {
            const idx = Number(el.dataset.block);
            const mode = el.dataset.blockMode;
            if (state.screen === "frame-result") runExclusive(() => startBlockMode(idx, mode));
            else runExclusive(() => generateBlockVariants(idx, mode, false));
          };
        });

        document.querySelectorAll("[data-block-more]").forEach((el) => {
          const idx = Number(el.dataset.blockMore);
          el.onclick = () =>
            runExclusive(() =>
              generateBlockVariants(idx, state.blockModes[idx] || "rephrase", true)
            );
        });

        const stopAnalysisBtn = document.getElementById("stopAnalysisBtn");
        if (stopAnalysisBtn) stopAnalysisBtn.onclick = stopCurrentJob;

        const openRulesBtn = document.getElementById("openRulesBtn");
        if (openRulesBtn) {
          openRulesBtn.onclick = () => {
            state.openRule = -1;
            go("rules");
          };
        }

        const openSettingsBtn = document.getElementById("openSettingsBtn");
        if (openSettingsBtn) openSettingsBtn.onclick = () => go("settings");

        document.querySelectorAll(".accordion-header").forEach((el) => {
          el.onclick = () => {
            const idx = Number(el.dataset.ruleIdx);
            state.openRule = state.openRule === idx ? -1 : idx;
            render();
          };
        });

        document.querySelectorAll("[data-mode]").forEach((el) => {
          el.onclick = () => runExclusive(() => chooseMode(el.dataset.mode));
        });

        document.querySelectorAll(".applyVariantBtn").forEach((el) => {
          el.onclick = () => {
            const blockIdx = el.dataset.block === undefined ? -1 : Number(el.dataset.block);
            const list = blockIdx >= 0 ? state.blockVariants[blockIdx] || [] : state.variants;
            const variant = list[Number(el.dataset.idx)];
            if (!variant) return;
            const nodeId =
              blockIdx >= 0 ? (state.frameTexts[blockIdx] || {}).id : state.selectionNodeId;
            const originalText =
              blockIdx >= 0 ? state.frameTexts[blockIdx].text : state.selectionText;
            bridge.send("apply-variant", { text: variant.text, nodeId, originalText });
          };
        });

        const moreVariantsBtn = document.getElementById("moreVariantsBtn");
        if (moreVariantsBtn)
          moreVariantsBtn.onclick = () => runExclusive(() => generateVariants(true));

        document
          .querySelectorAll(".fix-item[data-fragment-idx], .result-tag[data-fragment-idx]")
          .forEach((el) => {
            const scope = el.closest(".frame-block") || document;
            const fragment = scope.querySelector(
              `.result-fragment[data-fragment-idx="${el.dataset.fragmentIdx}"]`
            );
            if (!fragment) return;
            el.onmouseenter = () => fragment.classList.add("is-active");
            el.onmouseleave = () => fragment.classList.remove("is-active");
          });

        const endpointSelect = document.getElementById("endpointSelect");
        if (endpointSelect) {
          endpointSelect.onchange = () => {
            state.settings.endpoint = endpointSelect.value;
            ensureValidModel();
            state.apiStatus = "idle";
            render();
          };
        }

        const apiUrlInput = document.getElementById("apiUrlInput");
        if (apiUrlInput) {
          apiUrlInput.oninput = () => {
            state.settings.apiUrl = apiUrlInput.value;
            updateSettingsActionButtons();
          };
        }

        const changeApiTokenBtn = document.getElementById("changeApiTokenBtn");
        if (changeApiTokenBtn) {
          changeApiTokenBtn.onclick = () => {
            state.apiTokenUnlocked[state.settings.endpoint] = true;
            setCurrentApiToken("");
            render();
            document.getElementById("apiTokenInput")?.focus();
          };
        }

        const apiTokenInput = document.getElementById("apiTokenInput");
        if (apiTokenInput) {
          apiTokenInput.oninput = () => {
            setCurrentApiToken(apiTokenInput.value);
            updateSettingsActionButtons();
          };
          apiTokenInput.onchange = apiTokenInput.oninput;
          apiTokenInput.onblur = () => {
            setCurrentApiToken(sanitizeApiKey(apiTokenInput.value));
            render();
          };
        }

        const modelSelect = document.getElementById("modelSelect");
        if (modelSelect) {
          modelSelect.onchange = () => {
            state.settings.model = modelSelect.value;
          };
        }

        const explainInput = document.getElementById("explainInput");
        if (explainInput) {
          explainInput.onchange = () => {
            state.settings.explainVariants = explainInput.checked;
          };
        }

        const neighbourInput = document.getElementById("neighbourInput");
        if (neighbourInput) {
          neighbourInput.onchange = () => {
            state.settings.analyzeNeighbour = neighbourInput.checked;
          };
        }

        const countInput = document.getElementById("countInput");
        if (countInput) {
          countInput.onchange = () => {
            state.settings.variantsCount = Math.max(1, Math.min(5, Number(countInput.value || 3)));
          };
        }

        const saveSettingsBtn = document.getElementById("saveSettingsBtn");
        if (saveSettingsBtn) {
          saveSettingsBtn.onclick = () => {
            setCurrentApiToken(sanitizeApiKey(currentApiToken()));
            saveSettingsExplicit();
            render();
          };
        }

        const checkConnectionBtn = document.getElementById("checkConnectionBtn");
        if (checkConnectionBtn) {
          checkConnectionBtn.onclick = () => checkApiKey();
        }

        const apiHelpBtn = document.getElementById("apiHelpBtn");
        if (apiHelpBtn) {
          apiHelpBtn.onclick = (event) => {
            event.stopPropagation();
            state.helpOpen = state.helpOpen === "api" ? "" : "api";
            render();
          };
        }

        document.querySelectorAll(".toast-close[data-toast-id]").forEach((btn) => {
          btn.onclick = () => dismissToast(Number(btn.dataset.toastId));
        });
      }

      function bindResizeHandle() {
        const handle = document.getElementById("resize-handle");
        if (!handle) return;
        let startX = 0;
        let startY = 0;
        let startW = 0;
        let startH = 0;
        let dragging = false;

        handle.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          dragging = true;
          handle.setPointerCapture(event.pointerId);
          startX = event.screenX;
          startY = event.screenY;
          startW = window.innerWidth;
          startH = window.innerHeight;
        });

        handle.addEventListener("pointermove", (event) => {
          if (!dragging) return;
          bridge.send("resize", {
            width: startW + (event.screenX - startX),
            height: startH + (event.screenY - startY),
          });
        });

        const stop = () => {
          dragging = false;
        };
        handle.addEventListener("pointerup", stop);
        handle.addEventListener("pointercancel", stop);
      }

      async function bootstrap() {
        render();
        bindResizeHandle();
        await ensureRulesReady();
        bridge.send("load-settings");
        bridge.send("load-cache");
        bridge.send("get-selection");
      }

      bootstrap();
    </script>
  </body>
</html>
